    function determineBrandKey(brandStr, refCode = '') {
      const lower = (brandStr || '').toLowerCase();
      const lowerRef = (refCode || '').toLowerCase();
      if (lower.includes('delicious') || lower.includes('kitchen') || lowerRef.startsWith('dk')) return 'dk';
      if (lower.includes('aashna') || lower.includes('boutique') || lowerRef.startsWith('ab')) return 'ab';
      return 'other';
    }

    function parseDateString(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return null;
      const trimmed = dateStr.trim();
      if (!trimmed) return null;
      const parts = trimmed.split(/[\/\-]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) {
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m, d);
        } else {
          const m = parseInt(parts[0], 10) - 1;
          const d = parseInt(parts[1], 10);
          const y = parseInt(parts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m, d);
        }
      }
      const parsed = new Date(trimmed);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function parseEventsFromCSV(csvText) {
      const result = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: 'greedy',
        transformHeader: (header) => header.trim(),
      });

      const rows = result.data;
      const rawEvents = [];

      for (const row of rows) {
        const keys = Object.keys(row);
        const dateKey = keys.find((k) => /^date/i.test(k));
        const brandKeyCol = keys.find((k) => /^brand/i.test(k));
        const contentKey = keys.find((k) => /content|idea|topic|title|caption/i.test(k));
        const statusKey = keys.find((k) => /^status/i.test(k));
        const notesKey = keys.find((k) => /note|desc|comment/i.test(k));

        const dateStr = (dateKey ? row[dateKey] : Object.values(row)[0] || '').trim();
        if (!dateStr) continue;

        const dateObj = parseDateString(dateStr);
        if (!dateObj) continue;

        const brand = (brandKeyCol ? row[brandKeyCol] : '').trim() || 'Unassigned';
        const contentIdea = (contentKey ? row[contentKey] : '').trim();
        const status = (statusKey ? row[statusKey] : '').trim() || 'Planned';
        const notes = (notesKey ? row[notesKey] : '').trim();

        rawEvents.push({
          dateObj,
          dateStr,
          brand,
          brandKey: determineBrandKey(brand),
          contentIdea,
          status,
          notes,
          rawRow: row,
        });
      }

      rawEvents.sort((a, b) => a.dateObj.getTime() - b.dateObj.getTime());

      const brandCounters = { dk: 0, ab: 0, other: 0 };
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const events = rawEvents.map((item, idx) => {
        const bKey = item.brandKey;
        brandCounters[bKey] = (brandCounters[bKey] || 0) + 1;
        const count = brandCounters[bKey];

        let refPrefix = 'POST';
        if (bKey === 'dk') refPrefix = 'DK';
        else if (bKey === 'ab') refPrefix = 'AB';

        const refCode = `${refPrefix} - Video ${count}`;
        const dayOfWeek = dayNames[item.dateObj.getDay()];
        const dayOfWeekShort = dayNamesShort[item.dateObj.getDay()];
        const monthName = monthNames[item.dateObj.getMonth()];
        const formattedDate = `${dayOfWeekShort}, ${monthName.slice(0, 3)} ${item.dateObj.getDate()}, ${item.dateObj.getFullYear()}`;

        let normalizedStatus = item.status || 'Planned';
        if (!item.contentIdea && normalizedStatus.toLowerCase() === 'planned') {
          normalizedStatus = 'Idea Needed';
        }

        return {
          id: `event-${item.dateObj.getTime()}-${idx}`,
          dateStr: item.dateStr,
          formattedDate,
          dateObj: item.dateObj,
          year: item.dateObj.getFullYear(),
          month: item.dateObj.getMonth(),
          day: item.dateObj.getDate(),
          dayOfWeek,
          dayOfWeekShort,
          brand: item.brand,
          brandKey: item.brandKey,
          refCode,
          videoNumber: count,
          contentIdea: item.contentIdea,
          status: normalizedStatus,
          notes: item.notes,
        };
      });

      const monthsMap = new Map();
      for (const event of events) {
        const key = `${event.year}-${event.month}`;
        const monthName = monthNames[event.month];
        const label = `${monthName} ${event.year}`;

        if (!monthsMap.has(key)) {
          monthsMap.set(key, {
            key,
            year: event.year,
            month: event.month,
            label,
            monthName,
            totalEvents: 0,
            dkCount: 0,
            abCount: 0,
            postedCount: 0,
            editedCount: 0,
            plannedCount: 0,
            emptyCount: 0,
          });
        }

        const meta = monthsMap.get(key);
        meta.totalEvents++;
        if (event.brandKey === 'dk') meta.dkCount++;
        if (event.brandKey === 'ab') meta.abCount++;

        const statusLower = (event.status || '').toLowerCase();
        if (statusLower === 'posted') meta.postedCount++;
        else if (statusLower === 'edited') meta.editedCount++;
        else if (!event.contentIdea) meta.emptyCount++;
        else meta.plannedCount++;
      }

      const months = Array.from(monthsMap.values()).sort((a, b) => {
        if (a.year !== b.year) return a.year - b.year;
        return a.month - b.month;
      });

      return { events, months };
    }

    async function fetchLiveSheetData(csvUrl = DEFAULT_SHEET_CSV_URL) {
      try {
        const separator = csvUrl.includes('?') ? '&' : '?';
        const cacheBusterUrl = `${csvUrl}${separator}_t=${Date.now()}`;
        const response = await fetch(cacheBusterUrl, {
          method: 'GET',
          headers: { Accept: 'text/csv, text/plain, */*' },
        });

        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const text = await response.text();
        if (!text || text.trim().length === 0 || text.includes('Temporary Redirect')) {
          throw new Error('Received empty or redirect response');
        }

        const { events, months } = parseEventsFromCSV(text);
        if (events.length === 0) throw new Error('No valid events parsed');

        return { events, months, fetchedAt: new Date(), isFallback: false };
      } catch (error) {
        console.warn('Google Sheet live fetch fallback applied:', error);
        const { events, months } = parseEventsFromCSV(FALLBACK_CSV);
        return { events, months, fetchedAt: new Date(), isFallback: true };
      }
    }

        if (s.includes('idea') || s.includes('needed') || !event.contentIdea) {

              <Icons.HelpCircle className="w-2.5 h-2.5" />

            </span>
          );
        }
        return (
          <span className="inline-flex items-center gap-1 px-1.5 py-0.5 text-[9px] font-mono-tag font-bold uppercase tracking-wider bg-[#1a1a1a] text-[#888888] border border-[#333333]">
            <Icons.Clock className="w-2.5 h-2.5 text-[#D4FF00]" />
            <span>PLANNED</span>
          </span>
        );
      };

      if (compact) {
        return (
          <div
            onClick={onClick}
            className={`group p-2 border transition-all cursor-pointer select-none text-left relative overflow-hidden ${
              isDK ? 'bg-[#181818] border-[#332211] hover:border-[#FF8A00] hover:bg-[#201a14]' : isAB ? 'bg-[#181818] border-[#331122] hover:border-[#FF2E93] hover:bg-[#20141c]' : 'bg-[#181818] border-[#2A2A2A] hover:border-[#D4FF00]'
            }`}
          >
            <div className={`absolute left-0 top-0 bottom-0 w-1 ${isDK ? 'bg-[#FF8A00]' : isAB ? 'bg-[#FF2E93]' : 'bg-[#D4FF00]'}`} />
            <div className="pl-1.5 space-y-1">
              <div className="flex items-center justify-between gap-1">
                <span className={`text-[9px] font-mono-tag font-bold uppercase tracking-wider px-1 py-0.5 ${
                  isDK ? 'bg-[#2a1a0c] text-[#FF8A00] border border-[#442a10]' : isAB ? 'bg-[#2a0c1a] text-[#FF2E93] border border-[#44102a]' : 'bg-[#222222] text-[#888888]'
                }`}>
                  {event.refCode}
                </span>
                {getStatusBadge(event.status)}
              </div>
              <p className="text-xs font-medium text-[#FFFFFF] line-clamp-2 group-hover:text-[#D4FF00] transition leading-tight">
                {event.contentIdea || <span className="italic text-[#666666] font-normal">+ Enter content in sheet</span>}
              </p>
              <div className="text-[10px] font-mono-tag text-[#888888] flex items-center justify-between truncate pt-0.5 uppercase tracking-wider">
                <span className="truncate flex items-center gap-1">
                  {isDK ? <Icons.Utensils className="w-2.5 h-2.5 text-[#FF8A00] shrink-0" /> : <Icons.Sparkle className="w-2.5 h-2.5 text-[#FF2E93] shrink-0" />}
                  {event.brand}
                </span>
                <span className="text-[#555555]">#{event.videoNumber}</span>
              </div>
            </div>
          </div>

      return (
        <div
          onClick={onClick}
          className={`group p-3 border transition-all duration-200 cursor-pointer select-none text-left relative overflow-hidden ${
            isDK ? 'bg-[#181818] border-[#332211] hover:border-[#FF8A00] hover:bg-[#1f1912]' : isAB ? 'bg-[#181818] border-[#331122] hover:border-[#FF2E93] hover:bg-[#1f121a]' : 'bg-[#181818] border-[#2A2A2A] hover:border-[#D4FF00]'
          }`}
        >
          <div className={`absolute left-0 top-0 bottom-0 w-1 ${isDK ? 'bg-[#FF8A00]' : isAB ? 'bg-[#FF2E93]' : 'bg-[#D4FF00]'}`} />
          <div className="pl-2 space-y-2">
            <div className="flex items-center justify-between gap-1 flex-wrap">
              <div className="flex items-center gap-1.5 font-mono-tag">
                {isDK ? (
                  <span className="p-0.5 bg-[#2a1a0c] text-[#FF8A00] border border-[#442a10]"><Icons.Utensils className="w-3 h-3" /></span>
                ) : isAB ? (
                  <span className="p-0.5 bg-[#2a0c1a] text-[#FF2E93] border border-[#44102a]"><Icons.Sparkle className="w-3 h-3" /></span>
                ) : null}
                <span className="text-[11px] font-bold tracking-wider text-white">{event.refCode}</span>
              </div>
              {getStatusBadge(event.status)}
            </div>
            <h4 className="text-xs sm:text-[13px] font-semibold text-[#FFFFFF] group-hover:text-[#D4FF00] line-clamp-2 leading-snug transition">
              {event.contentIdea || <span className="text-[#666666] italic font-normal">Topic pending in Google Sheet</span>}
            </h4>
            <div className="flex items-center justify-between text-[10px] font-mono-tag text-[#888888] pt-1.5 border-t border-[#262626] uppercase tracking-wider">
              <span className="truncate">{event.brand}</span>
              <span className="text-[#D4FF00]">VOL #{event.videoNumber}</span>
            </div>
          </div>
        </div>
      );
    }

    /* Month Calendar Grid */
    function MonthCalendarGrid({ monthMeta, events, brandFilter, onSelectEvent }) {
      const year = monthMeta.year;
      const month = monthMeta.month;
      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const dayHeaders = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      const today = new Date();
      const isCurrentMonthActual = today.getFullYear() === year && today.getMonth() === month;
      const actualTodayDate = today.getDate();

      const eventsByDay = useMemo(() => {
        const map = new Map();
        for (const event of events) {
          if (event.year === year && event.month === month) {
            if (brandFilter !== 'all' && event.brandKey !== brandFilter) continue;
            const d = event.day;
            if (!map.has(d)) map.set(d, []);
            map.get(d).push(event);
          }
        }
        return map;
      }, [events, year, month, brandFilter]);

      const totalCells = Math.ceil((firstDayIndex + daysInMonth) / 7) * 7;
      const cells = [];

      for (let i = 0; i < totalCells; i++) {
        if (i < firstDayIndex) {
          const prevDayNum = prevMonthDays - (firstDayIndex - i - 1);
          cells.push(
            <div key={`prev-${i}`} className="min-h-[110px] sm:min-h-[125px] p-2 bg-[#0C0C0C]/50 border border-[#1A1A1A] opacity-25 select-none flex flex-col justify-between">
              <span className="text-xs font-mono-tag font-bold text-[#555555]">{prevDayNum}</span>
            </div>
          );
        } else if (i < firstDayIndex + daysInMonth) {
          const dayNum = i - firstDayIndex + 1;
          const dayEvents = eventsByDay.get(dayNum) || [];
          const isToday = isCurrentMonthActual && dayNum === actualTodayDate;
          const hasEvents = dayEvents.length > 0;

          cells.push(
            <div
              key={`day-${dayNum}`}
              className={`min-h-[115px] sm:min-h-[140px] p-2 sm:p-2.5 border transition-all flex flex-col justify-between relative group ${
                isToday ? 'bg-[#181818] border-[#D4FF00] glow-accent ring-1 ring-[#D4FF00]' : hasEvents ? 'bg-[#181818] border-[#262626] hover:border-[#3A3A3A]' : 'bg-[#121212] border-[#1E1E1E] hover:border-[#282828]'
              }`}
            >
              <div className="flex items-center justify-between gap-1 mb-1.5 font-mono-tag">
                <span className={`text-xs sm:text-sm font-bold px-1.5 py-0.2 ${isToday ? 'bg-[#D4FF00] text-black font-black' : hasEvents ? 'text-white bg-[#222222]' : 'text-[#555555]'}`}>
                  {dayNum < 10 ? `0${dayNum}` : dayNum}
                </span>
                {isToday && <span className="text-[9px] uppercase font-bold tracking-widest text-[#D4FF00]">TODAY</span>}
                {!hasEvents && (
                  <span className="text-[9px] text-[#444444] font-medium flex items-center gap-1">
                    <Icons.Moon className="w-2.5 h-2.5" />
                    <span className="hidden xl:inline uppercase">REST</span>
                  </span>
                )}
              </div>

              <div className="space-y-1.5 flex-1 flex flex-col justify-start">
                {hasEvents ? (
                  dayEvents.map((event) => (
                    <EventCard key={event.id} event={event} onClick={() => onSelectEvent(event)} compact />
                  ))
                ) : (
                  <div className="h-full flex items-center justify-center py-2">
                    <div className="text-[10px] font-mono-tag text-[#3A3A3A] uppercase tracking-wider text-center select-none">
                      NO POST
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        } else {
          const nextDayNum = i - (firstDayIndex + daysInMonth) + 1;
          cells.push(
            <div key={`next-${i}`} className="min-h-[110px] sm:min-h-[125px] p-2 bg-[#0C0C0C]/50 border border-[#1A1A1A] opacity-25 select-none flex flex-col justify-between">
              <span className="text-xs font-mono-tag font-bold text-[#555555]">{nextDayNum < 10 ? `0${nextDayNum}` : nextDayNum}</span>
            </div>
          );
        }
      }

      return (
        <div className="w-full bg-[#141414] border border-[#262626] p-3 sm:p-5">
          <div className="grid grid-cols-7 gap-1.5 sm:gap-2 mb-2 sm:mb-2.5 font-mono-tag">
            {dayHeaders.map((day, idx) => (
              <div
                key={day}
                className={`text-center py-1.5 text-[11px] font-bold uppercase tracking-wider border ${
                  idx === 0 || idx === 6 ? 'bg-[#181818] text-[#888888] border-[#222222]' : 'bg-[#0C0C0C] text-[#D4FF00] border-[#262626]'
                }`}
              >
                {day}
              </div>
            ))}
          </div>

          <div className="grid grid-cols-7 gap-1.5 sm:gap-2">{cells}</div>

          <div className="mt-4 pt-3 border-t border-[#222222] flex flex-col sm:flex-row items-center justify-between gap-3 text-[11px] font-mono-tag text-[#888888] uppercase tracking-wider">
            <div className="flex items-center gap-2">
              <Icons.Info className="w-3.5 h-3.5 text-[#D4FF00] shrink-0" />
              <span>
                CADENCE: <strong className="text-white">2 VIDEOS / WEEK PER ACCOUNT</strong> (NO DAY COLLISION)
              </span>
            </div>
            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1.5 text-[#FF8A00] font-bold">
                <span className="w-2 h-2 bg-[#FF8A00]"></span> DELICIOUS KITCHEN
              </span>
              <span className="flex items-center gap-1.5 text-[#FF2E93] font-bold">
                <span className="w-2 h-2 bg-[#FF2E93]"></span> AASHNA BOUTIQUE
              </span>
            </div>
          </div>
        </div>
      );
    }

    /* Queue Table */
    function QueueTable({ events, activeMonthMeta, brandFilter, onSelectEvent }) {
      const [filterByActiveMonthOnly, setFilterByActiveMonthOnly] = useState(false);
      const [copiedId, setCopiedId] = useState(null);

      const filteredEvents = useMemo(() => {
        return events.filter((e) => {
          if (brandFilter !== 'all' && e.brandKey !== brandFilter) return false;
          if (filterByActiveMonthOnly && (e.year !== activeMonthMeta.year || e.month !== activeMonthMeta.month)) return false;
          return true;
        });
      }, [events, brandFilter, filterByActiveMonthOnly, activeMonthMeta]);

      const handleCopy = (e, ev) => {
        e.stopPropagation();
        const text = `${ev.brand} | ${ev.refCode}\nDate: ${ev.formattedDate}\nTopic: ${ev.contentIdea || 'TBD'}\nStatus: ${ev.status}`;
        navigator.clipboard.writeText(text);
        setCopiedId(ev.id);
        setTimeout(() => setCopiedId(null), 2000);
      };

      const getStatusBadge = (status, hasIdea) => {
        const s = (status || '').toLowerCase();
        if (s.includes('posted')) {
          return (
            <span className="inline-flex items-center gap-1 px-2 py-0.5 text-[9px] font-mono-tag font-bold uppercase tracking-wider bg-[#102414] text-[#44FF44] border border-[#225522]">
              <Icons.CheckCircle2 className="w-2.5 h-2.5" />
              <span>POSTED</span>
            </span>
          );
        }
        if (s.includes('edited')) {
          return (
            <span className="inline-flex items-center gap-1 px-2 py-0.5 text-[9px] font-mono-tag font-bold uppercase tracking-wider bg-[#14202c] text-[#00E5FF] border border-[#1d425c]">
              <Icons.Scissors className="w-2.5 h-2.5" />
              <span>EDITED</span>
            </span>
          );
        }
        if (s.includes('idea') || !hasIdea) {
          return (
            <span className="inline-flex items-center gap-1 px-2 py-0.5 text-[9px] font-mono-tag font-bold uppercase tracking-wider bg-[#26200c] text-[#D4FF00] border border-[#4d4414] animate-pulse">
              <Icons.HelpCircle className="w-2.5 h-2.5" />
              <span>IDEA NEEDED</span>
            </span>
          );
        }
        return (
          <span className="inline-flex items-center gap-1 px-2 py-0.5 text-[9px] font-mono-tag font-bold uppercase tracking-wider bg-[#181818] text-[#888888] border border-[#333333]">
            <Icons.Clock className="w-2.5 h-2.5 text-[#D4FF00]" />
            <span>PLANNED</span>
          </span>
        );
      };

      return (
        <div className="w-full bg-[#141414] border border-[#262626] p-4 sm:p-6 space-y-4 font-mono-tag">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-[#262626]">
            <div>
              <h3 className="text-sm sm:text-base font-bold text-white uppercase tracking-wider flex items-center gap-2">
                <span>PRODUCTION QUEUE</span>
                <span className="text-[10px] font-bold px-2 py-0.5 bg-[#D4FF00] text-black">
                  {filteredEvents.length} ITEMS
                </span>
              </h3>
              <p className="text-[11px] text-[#888888] mt-0.5 uppercase tracking-wide">
                LIVE SYNCHRONIZATION WITH CLOUD SPREADSHEET
              </p>
            </div>

            <div className="flex items-center gap-2 flex-wrap text-xs">
              <button
                onClick={() => setFilterByActiveMonthOnly(!filterByActiveMonthOnly)}
                className={`px-3 py-1.5 uppercase font-bold tracking-wider border transition text-[11px] ${
                  filterByActiveMonthOnly ? 'bg-[#D4FF00] border-[#D4FF00] text-black font-black' : 'bg-[#0C0C0C] border-[#2A2A2A] text-[#888888] hover:text-white'
                }`}
              >
                {filterByActiveMonthOnly ? `ONLY ${activeMonthMeta.monthName}` : 'ALL MONTHS'}
              </button>

              <a
                href={GOOGLE_SHEET_VIEW_URL}
                target="_blank"
                rel="noopener noreferrer"
                className="px-3 py-1.5 bg-[#0C0C0C] hover:bg-[#181818] text-[#D4FF00] border border-[#2A2A2A] hover:border-[#D4FF00] text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 transition"
              >
                <Icons.FileSpreadsheet className="w-3 h-3" />
                <span>EDIT IN SHEET</span>
              </a>
            </div>
          </div>

          <div className="overflow-x-auto border border-[#262626] bg-[#0C0C0C]">
            <table className="w-full text-left border-collapse font-mono-tag">
              <thead>
                <tr className="bg-[#181818] text-[#888888] text-[10px] font-bold uppercase tracking-widest border-b border-[#262626]">
                  <th className="py-3 px-4 w-[16%]">PUBLISH DATE</th>
                  <th className="py-3 px-4 w-[10%]">DAY</th>
                  <th className="py-3 px-4 w-[22%]">BRAND</th>
                  <th className="py-3 px-4 w-[14%]">CODE</th>
                  <th className="py-3 px-4 w-[26%]">CONTENT IDEA</th>
                  <th className="py-3 px-4 w-[12%] text-center">STATUS</th>
                  <th className="py-3 px-4 w-[8%] text-right">ACTION</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#1A1A1A] text-xs">
                {filteredEvents.length === 0 ? (
                  <tr>
                    <td colSpan={7} className="py-12 text-center text-[#666666]">
                      <p className="text-xs font-bold uppercase tracking-wider">NO CONTENT ITEMS MATCH CURRENT CRITERIA</p>
                    </td>
                  </tr>
                ) : (
                  filteredEvents.map((event) => {
                    const isDK = event.brandKey === 'dk';
                    const isAB = event.brandKey === 'ab';
                    const hasIdea = Boolean(event.contentIdea && event.contentIdea.trim().length > 0);

                    return (
                      <tr
                        key={event.id}
                        onClick={() => onSelectEvent(event)}
                        className="hover:bg-[#181818] transition-colors cursor-pointer group"
                      >
                        <td className="py-3 px-4 font-bold text-white whitespace-nowrap">{event.formattedDate}</td>
                        <td className="py-3 px-4 text-[#888888] whitespace-nowrap">
                          <span className="px-1.5 py-0.5 bg-[#141414] text-[#888888] text-[10px] border border-[#222222]">
                            {event.dayOfWeek}
                          </span>
                        </td>
                        <td className="py-3 px-4 whitespace-nowrap">
                          <div className="flex items-center gap-2">
                            {isDK ? (
                              <span className="p-1 bg-[#2a1a0c] text-[#FF8A00] border border-[#442a10]"><Icons.Utensils className="w-3 h-3" /></span>
                            ) : isAB ? (
                              <span className="p-1 bg-[#2a0c1a] text-[#FF2E93] border border-[#44102a]"><Icons.Sparkle className="w-3 h-3" /></span>
                            ) : null}
                            <span className={`font-bold uppercase tracking-wider ${isDK ? 'text-[#FF8A00]' : isAB ? 'text-[#FF2E93]' : 'text-white'}`}>
                              {event.brand}
                            </span>
                          </div>
                        </td>
                        <td className="py-3 px-4 whitespace-nowrap">
                          <span className={`inline-block px-1.5 py-0.5 text-[10px] font-bold tracking-wider ${
                            isDK ? 'bg-[#2a1a0c] text-[#FF8A00] border border-[#442a10]' : isAB ? 'bg-[#2a0c1a] text-[#FF2E93] border border-[#44102a]' : 'bg-[#181818] text-[#888888] border border-[#333333]'
                          }`}>
                            {event.refCode}
                          </span>
                        </td>
                        <td className="py-3 px-4">
                          {hasIdea ? (
                            <span className="font-sans font-medium text-white group-hover:text-[#D4FF00] transition">{event.contentIdea}</span>
                          ) : (
                            <span className="italic text-[#555555] font-normal">(Topic pending in sheet)</span>
                          )}
                        </td>
                        <td className="py-3 px-4 text-center whitespace-nowrap">{getStatusBadge(event.status, hasIdea)}</td>
                        <td className="py-3 px-4 text-right whitespace-nowrap">
                          <button
                            onClick={(e) => handleCopy(e, event)}
                            className="p-1 bg-[#141414] hover:bg-[#222222] text-[#888888] hover:text-[#D4FF00] border border-[#2A2A2A] transition"
                            title="Copy video details"
                          >
                            {copiedId === event.id ? <Icons.Check className="w-3 h-3 text-[#44FF44]" /> : <Icons.Copy className="w-3 h-3" />}
                          </button>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    /* Modal Component */
    function EventDetailModal({ event, onClose }) {
      const [copied, setCopied] = useState(false);
      if (!event) return null;

      const isDK = event.brandKey === 'dk';
      const isAB = event.brandKey === 'ab';

      const captionTemplate = useMemo(() => {
        const title = event.contentIdea || 'New Video Post';
        const brandHashtags = isDK
          ? '#DeliciousKitchen #IndianFood #RecipeOfTheDay #HomeCooking #FoodReels #DesiFoodie'
          : '#AashnaBoutique #FashionStyle #EthnicWear #TrendingFashion #OOTD #BoutiqueCollection';
        return `✨ ${title}\n\nCatch our latest video showcasing ${event.brand}! Follow for daily inspiration and exclusive updates.\n\n📍 Brand: ${event.brand}\n📅 Scheduled: ${event.formattedDate}\n\n${brandHashtags}`;
      }, [event, isDK]);

      const handleCopyCaption = () => {
        navigator.clipboard.writeText(captionTemplate);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">

              <Icons.X className="w-4 h-4" />

            <div className="flex items-start gap-3.5 mb-5">
              <div className={`p-3 border flex-shrink-0 ${
                isDK ? 'bg-[#2a1a0c] text-[#FF8A00] border-[#442a10]' : isAB ? 'bg-[#2a0c1a] text-[#FF2E93] border-[#44102a]' : 'bg-[#181818] text-[#D4FF00] border-[#2A2A2A]'
              }`}>
                {isDK ? <Icons.Utensils className="w-5 h-5" /> : isAB ? <Icons.Sparkle className="w-5 h-5" /> : <Icons.Calendar className="w-5 h-5" />}
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className={`text-[11px] font-bold px-2 py-0.5 uppercase tracking-wider ${
                    isDK ? 'bg-[#2a1a0c] text-[#FF8A00] border border-[#442a10]' : isAB ? 'bg-[#2a0c1a] text-[#FF2E93] border border-[#44102a]' : 'bg-[#181818] text-[#888888] border border-[#333333]'
                  }`}>
                    {event.refCode}
                  </span>
                  <span className="text-[11px] text-[#666666] uppercase">SEQ #{event.videoNumber}</span>
                </div>
                <h3 className="text-lg font-bold text-white mt-1 uppercase tracking-wider">{event.brand}</h3>
              </div>
            </div>

            <div className="space-y-4">
              <div className="p-4 bg-[#0C0C0C] border border-[#262626] space-y-1.5">
                <div className="text-[10px] font-bold uppercase tracking-widest text-[#888888]">VIDEO TOPIC / CONTENT DIRECTIVE</div>
                <div className="font-editorial text-2xl font-normal text-white leading-snug">
                  {event.contentIdea || <span className="italic text-[#666666] font-normal font-sans text-sm">No topic title entered yet. Update directly in connected Google Sheet.</span>}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div className="p-3 bg-[#0C0C0C] border border-[#262626] space-y-1">

                <div className="p-3 bg-[#0C0C0C] border border-[#262626] space-y-1">

              </div>

              <div className="p-3 bg-[#0C0C0C] border border-[#262626] space-y-2">

                <div>
                  <h3 className="text-sm font-bold text-white uppercase tracking-wider">CONNECTING TO GOOGLE SPREADSHEET...</h3>
                  <p className="text-xs text-[#888888] mt-1">Parsing real-time publishing dates and brand schedules.</p>
                </div>
              </div>
            ) : viewMode === 'month' ? (
              <MonthCalendarGrid
                monthMeta={activeMonthMeta}
                events={filteredEvents}
                brandFilter={brandFilter}
                onSelectEvent={(ev) => setSelectedEvent(ev)}
              />
            ) : viewMode === 'two-month' ? (
              <div className="space-y-6">
                <div className="flex items-center justify-between bg-[#141414] p-3 px-4 border border-[#222222] text-[#888888] text-[11px] font-mono-tag uppercase tracking-wider">
                  <div className="flex items-center gap-2">
                    <span className="w-1.5 h-1.5 bg-[#D4FF00] pulse-dot"></span>
                    <span className="font-bold text-white">BI-MONTH DUAL GRID:</span>
                    <span className="text-[#D4FF00] font-bold">{activeMonthMeta.label}</span>
                  </div>
                  <div className="text-[#666666] hidden md:block">CONSECUTIVE MULTI-MONTH PRODUCTION TIMELINE</div>
                </div>

                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
                  <div className="space-y-3">
                    <div className="flex items-center justify-between px-1 font-mono-tag">
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <span className="w-2 h-2 bg-[#D4FF00]"></span>
                        {activeMonthMeta.label}
                      </h3>
                      <span className="text-[10px] text-[#888888] bg-[#181818] border border-[#2A2A2A] px-2 py-0.5 font-bold uppercase">{activeMonthMeta.totalEvents} POSTS</span>
                    </div>
                    <MonthCalendarGrid
                      monthMeta={activeMonthMeta}
                      events={filteredEvents}
                      brandFilter={brandFilter}
                      onSelectEvent={(ev) => setSelectedEvent(ev)}
                    />
                  </div>

                  {months[currentMonthIndex + 1] && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between px-1 font-mono-tag">
                        <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                          <span className="w-2 h-2 bg-[#FF2E93]"></span>
                          {months[currentMonthIndex + 1].label}
                        </h3>
                        <span className="text-[10px] text-[#888888] bg-[#181818] border border-[#2A2A2A] px-2 py-0.5 font-bold uppercase">{months[currentMonthIndex + 1].totalEvents} POSTS</span>
                      </div>
                      <MonthCalendarGrid
                        monthMeta={months[currentMonthIndex + 1]}
                        events={filteredEvents}
                        brandFilter={brandFilter}
                        onSelectEvent={(ev) => setSelectedEvent(ev)}
                      />
                    </div>
                  )}
                </div>
              </div>
            ) : (
              <QueueTable
                events={filteredEvents}
                activeMonthMeta={activeMonthMeta}
                brandFilter={brandFilter}
                onSelectEvent={(ev) => setSelectedEvent(ev)}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="w-full border-t border-[#1C1C1C] bg-[#0C0C0C] py-5 px-4 text-center text-xs text-[#888888] font-mono-tag">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="w-1.5 h-1.5 bg-[#44FF44] pulse-dot"></span>
                <span className="text-[11px] uppercase tracking-wider">LIVE GOOGLE SPREADSHEET SYNC ENGINE ACTIVE</span>
              </div>
              <p className="text-[10px] text-[#666666] uppercase tracking-wider">
                PUBLISHING CADENCE: 2 VIDEOS/WEEK PER BRAND • DELICIOUS KITCHEN & AASHNA BOUTIQUE
              </p>
            </div>
          </footer>

          {/* Modal */}
          {selectedEvent && (
            <EventDetailModal
              event={selectedEvent}
              onClose={() => setSelectedEvent(null)}
            />
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
