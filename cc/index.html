    function determineBrandKey(brandStr, refCode = '') {
      const lower = (brandStr || '').toLowerCase();
      const lowerRef = (refCode || '').toLowerCase();
      if (lower.includes('delicious') || lower.includes('kitchen') || lowerRef.startsWith('dk')) return 'dk';
      if (lower.includes('aashna') || lower.includes('boutique') || lowerRef.startsWith('ab')) return 'ab';
      return 'other';
    }

    function parseDateString(dateStr) {
      if (!dateStr || typeof dateStr !== 'string') return null;
      const trimmed = dateStr.trim();
      if (!trimmed) return null;
      const parts = trimmed.split(/[\/\-]/);
      if (parts.length === 3) {
        if (parts[0].length === 4) {
          const y = parseInt(parts[0], 10);
          const m = parseInt(parts[1], 10) - 1;
          const d = parseInt(parts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m, d);
        } else {
          const m = parseInt(parts[0], 10) - 1;
          const d = parseInt(parts[1], 10);
          const y = parseInt(parts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m, d);
        }
      }
      const parsed = new Date(trimmed);
      return isNaN(parsed.getTime()) ? null : parsed;
    }

    function parseEventsFromCSV(csvText) {
      const result = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: 'greedy',
        transformHeader: (header) => header.trim(),
      });

      const rows = result.data;
      const rawEvents = [];

      for (const row of rows) {
        const keys = Object.keys(row);
        const dateKey = keys.find((k) => /^date/i.test(k));
        const brandKeyCol = keys.find((k) => /^brand/i.test(k));
        const contentKey = keys.find((k) => /content|idea|topic|title|caption/i.test(k));
        const statusKey = keys.find((k) => /^status/i.test(k));
        const notesKey = keys.find((k) => /note|desc|comment/i.test(k));

        const dateStr = (dateKey ? row[dateKey] : Object.values(row)[0] || '').trim();
        if (!dateStr) continue;

        const dateObj = parseDateString(dateStr);
        if (!dateObj) continue;

        const rawBrand = (brandKeyCol ? row[brandKeyCol] : '').trim();
        const contentIdea = (contentKey ? row[contentKey] : '').trim();
        const status = (statusKey ? row[statusKey] : '').trim() || 'Planned';
        const notes = (notesKey ? row[notesKey] : '').trim();

        // Skip rows that have a date but no brand and no content idea (blank spreadsheet rows)
        if (!rawBrand && !contentIdea) continue;

        const brand = rawBrand || 'Unassigned';

        rawEvents.push({
          dateObj,
          dateStr,
          brand,
          brandKey: determineBrandKey(brand),
          contentIdea,
          status,
          notes,
          rawRow: row,
        });
      }

      rawEvents.sort((a, b) => a.dateObj.getTime() - b.dateObj.getTime());

      const brandCounters = { dk: 0, ab: 0, other: 0 };
      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const dayNamesShort = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

      const events = rawEvents.map((item, idx) => {
        const bKey = item.brandKey;
        brandCounters[bKey] = (brandCounters[bKey] || 0) + 1;
        const count = brandCounters[bKey];

        let refPrefix = 'POST';
        if (bKey === 'dk') refPrefix = 'DK';
        else if (bKey === 'ab') refPrefix = 'AB';

        const refCode = `${refPrefix} - Video ${count}`;
        const dayOfWeek = dayNames[item.dateObj.getDay()];
        const dayOfWeekShort = dayNamesShort[item.dateObj.getDay()];
        const monthName = monthNames[item.dateObj.getMonth()];
        const formattedDate = `${dayOfWeekShort}, ${monthName.slice(0, 3)} ${item.dateObj.getDate()}, ${item.dateObj.getFullYear()}`;

        let normalizedStatus = item.status || 'Planned';
        if (!item.contentIdea && normalizedStatus.toLowerCase() === 'planned') {
          normalizedStatus = 'Idea Needed';
        }

        return {
          id: `event-${item.dateObj.getTime()}-${idx}`,
          dateStr: item.dateStr,
          formattedDate,
          dateObj: item.dateObj,
          year: item.dateObj.getFullYear(),
          month: item.dateObj.getMonth(),
          day: item.dateObj.getDate(),
          dayOfWeek,
          dayOfWeekShort,
          brand: item.brand,
          brandKey: item.brandKey,
          refCode,
          videoNumber: count,
          contentIdea: item.contentIdea,
          status: normalizedStatus,
          notes: item.notes,
        };
      });

      const monthsMap = new Map();
      for (const event of events) {
        const key = `${event.year}-${event.month}`;
        const monthName = monthNames[event.month];
        const label = `${monthName} ${event.year}`;

        if (!monthsMap.has(key)) {
          monthsMap.set(key, {
            key,
            year: event.year,
            month: event.month,
            label,
            monthName,
            totalEvents: 0,
            dkCount: 0,
            abCount: 0,
            postedCount: 0,
            editedCount: 0,
            plannedCount: 0,
            emptyCount: 0,
          });
        }

        const meta = monthsMap.get(key);
        meta.totalEvents++;
        if (event.brandKey === 'dk') meta.dkCount++;
        if (event.brandKey === 'ab') meta.abCount++;

        const statusLower = (event.status || '').toLowerCase();
        if (statusLower === 'posted') meta.postedCount++;
        else if (statusLower === 'edited') meta.editedCount++;
        else if (!event.contentIdea) meta.emptyCount++;
        else meta.plannedCount++;
      }

      const months = Array.from(monthsMap.values()).sort((a, b) => {
        if (a.year !== b.year) return a.year - b.year;
        return a.month - b.month;
      });

      return { events, months };
    }

    async function fetchLiveSheetData(csvUrl = DEFAULT_SHEET_CSV_URL) {
      try {
        const separator = csvUrl.includes('?') ? '&' : '?';
        const cacheBusterUrl = `${csvUrl}${separator}_t=${Date.now()}`;
        const response = await fetch(cacheBusterUrl, {
          method: 'GET',
          headers: { Accept: 'text/csv, text/plain, */*' },
        });

        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        const text = await response.text();
        if (!text || text.trim().length === 0 || text.includes('Temporary Redirect')) {
          throw new Error('Received empty or redirect response');
        }

        const { events, months } = parseEventsFromCSV(text);
        if (events.length === 0) throw new Error('No valid events parsed');

        try {
          localStorage.setItem('cached_calendar_csv', text);
          localStorage.setItem('cached_calendar_time', new Date().toISOString());
        } catch (e) {}

        return { events, months, fetchedAt: new Date(), isFallback: false };
      } catch (error) {
        console.warn('Google Sheet live fetch fallback applied:', error);
        
        let fallbackText = FALLBACK_CSV;
        try {
          const cached = localStorage.getItem('cached_calendar_csv');
          if (cached && cached.length > 50) fallbackText = cached;
        } catch (e) {}

        const { events, months } = parseEventsFromCSV(fallbackText);
        return { events, months, fetchedAt: new Date(), isFallback: true };
      }
    }

    function exportToICS(events) {
      if (!events || events.length === 0) return;
      const pad = (n) => (n < 10 ? `0${n}` : `${n}`);

      let icsContent = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Content Calendar Studio//Dual Brand Cadence//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'X-WR-CALNAME:Social Media Content Schedule',
        'X-WR-TIMEZONE:UTC',
      ];

      for (const ev of events) {
        const y = ev.year;
        const m = pad(ev.month + 1);
        const d = pad(ev.day);
        const dtStr = `${y}${m}${d}`;
        const summary = `[${ev.brand}] ${ev.refCode} - ${ev.contentIdea || 'Video Post'}`;
        const description = `Brand: ${ev.brand}\\nStatus: ${ev.status}\\nSequence: #${ev.videoNumber}\\nTopic: ${ev.contentIdea || 'Pending topic'}`;

        icsContent.push('BEGIN:VEVENT');
        icsContent.push(`UID:${ev.id}@contentcalendar.studio`);
        icsContent.push(`DTSTAMP:${dtStr}T090000Z`);
        icsContent.push(`DTSTART;VALUE=DATE:${dtStr}`);
        icsContent.push(`SUMMARY:${summary.replace(/,/g, '\\,')}`);
        icsContent.push(`DESCRIPTION:${description.replace(/,/g, '\\,')}`);
        icsContent.push(`STATUS:${ev.status.toUpperCase() === 'POSTED' ? 'CONFIRMED' : 'TENTATIVE'}`);
        icsContent.push('END:VEVENT');
      }

      icsContent.push('END:VCALENDAR');
      const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `content-calendar-schedule.ics`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    /* Month Calendar Grid */
    function MonthCalendarGrid({ monthMeta, events, brandFilter, onSelectEvent, onSelectEmptySlot }) {
      const year = monthMeta.year;
      const month = monthMeta.month;
      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const dayHeaders = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

      const today = new Date();
      const isCurrentMonthActual = today.getFullYear() === year && today.getMonth() === month;
      const actualTodayDate = today.getDate();

      const eventsByDay = useMemo(() => {
        const map = new Map();
        for (const event of events) {
          if (event.year === year && event.month === month) {
            if (brandFilter !== 'all' && event.brandKey !== brandFilter) continue;
            const d = event.day;
            if (!map.has(d)) map.set(d, []);
            map.get(d).push(event);
          }
        }
        return map;
      }, [events, year, month, brandFilter]);

      const totalCells = Math.ceil((firstDayIndex + daysInMonth) / 7) * 7;
      const cells = [];

      for (let i = 0; i < totalCells; i++) {
        if (i < firstDayIndex) {
          const prevDayNum = prevMonthDays - (firstDayIndex - i - 1);
          cells.push(
            <div key={`prev-${i}`} className="min-h-[110px] sm:min-h-[125px] p-2 bg-[#0C0C0C]/50 border border-[#1A1A1A] opacity-25 select-none flex flex-col justify-between">
              <span className="text-xs font-mono-tag font-bold text-[#555555]">{prevDayNum}</span>
            </div>
          );
        } else if (i < firstDayIndex + daysInMonth) {
          const dayNum = i - firstDayIndex + 1;
          const dayEvents = eventsByDay.get(dayNum) || [];
          const isToday = isCurrentMonthActual && dayNum === actualTodayDate;
          const hasEvents = dayEvents.length > 0;

          cells.push(
            <div
              key={`day-${dayNum}`}
              className={`min-h-[115px] sm:min-h-[140px] p-2 sm:p-2.5 border transition-all flex flex-col justify-between relative group ${
                isToday ? 'bg-[#181818] border-[#D4FF00] glow-accent ring-1 ring-[#D4FF00]' : hasEvents ? 'bg-[#181818] border-[#262626] hover:border-[#3A3A3A]' : 'bg-[#121212] border-[#1E1E1E] hover:border-[#282828]'
              }`}
            >
              <div className="flex items-center justify-between gap-1 mb-1.5 font-mono-tag">
                <span className={`text-xs sm:text-sm font-bold px-1.5 py-0.2 ${isToday ? 'bg-[#D4FF00] text-black font-black' : hasEvents ? 'text-white bg-[#222222]' : 'text-[#555555]'}`}>
                  {dayNum < 10 ? `0${dayNum}` : dayNum}
                </span>
                {isToday && <span className="text-[9px] uppercase font-bold tracking-widest text-[#D4FF00]">TODAY</span>}
                {!hasEvents && (
                  <span className="text-[9px] text-[#444444] font-medium flex items-center gap-1">
                    <Icons.Moon className="w-2.5 h-2.5" />
                    <span className="hidden xl:inline uppercase">REST</span>
                  </span>
                )}
              </div>

              <div className="space-y-1.5 flex-1 flex flex-col justify-start">
                {hasEvents ? (
                  dayEvents.map((event) => (
                    <EventCard key={event.id} event={event} onClick={() => onSelectEvent(event)} compact />
                  ))
                ) : (
                  <div
                    onClick={() => onSelectEmptySlot({ day: dayNum, month, year, monthName: monthMeta.monthName })}
                    className="h-full flex flex-col items-center justify-center py-2 cursor-pointer group/slot hover:bg-[#181818]/70 border border-transparent hover:border-[#333333] transition"
                    title="Click to schedule or copy template for this date"
                  >
                    <div className="text-[10px] font-mono-tag text-[#3A3A3A] group-hover/slot:text-[#D4FF00] uppercase tracking-wider text-center select-none flex items-center gap-1 transition">
                      <Icons.Plus className="w-2.5 h-2.5 opacity-0 group-hover/slot:opacity-100 transition" />
                      <span>NO POST</span>
                    </div>
                    <span className="text-[8px] text-[#444444] group-hover/slot:text-[#888888] font-mono-tag uppercase mt-0.5 opacity-0 group-hover/slot:opacity-100 transition">
                      + PLAN SLOT
                    </span>
                  </div>
                )}
              </div>
            </div>
          );
        } else {
          const nextDayNum = i - (firstDayIndex + daysInMonth) + 1;
          cells.push(
            <div key={`next-${i}`} className="min-h-[110px] sm:min-h-[125px] p-2 bg-[#0C0C0C]/50 border border-[#1A1A1A] opacity-25 select-none flex flex-col justify-between">
              <span className="text-xs font-mono-tag font-bold text-[#555555]">{nextDayNum < 10 ? `0${nextDayNum}` : nextDayNum}</span>
            </div>
          );
        }
      }

      return (
        <div className="w-full bg-[#141414] border border-[#262626] p-2.5 sm:p-5">
          <div className="flex items-center justify-between mb-2 text-[10px] text-[#666666] font-mono-tag lg:hidden uppercase tracking-wider">
            <span>📅 CALENDAR VIEW</span>
            <span className="text-[#D4FF00] flex items-center gap-1">SWIPE TO VIEW ↔️</span>
          </div>

          <div className="overflow-x-auto custom-scrollbar pb-2">
            <div className="min-w-[680px] lg:min-w-0">
              <div className="grid grid-cols-7 gap-1.5 sm:gap-2 mb-2 sm:mb-2.5 font-mono-tag">
                {dayHeaders.map((day, idx) => (
                  <div
                    key={day}
                    className={`text-center py-1.5 text-[11px] font-bold uppercase tracking-wider border ${
                      idx === 0 || idx === 6 ? 'bg-[#181818] text-[#888888] border-[#222222]' : 'bg-[#0C0C0C] text-[#D4FF00] border-[#262626]'
                    }`}
                  >
                    {day}
                  </div>
                ))}
              </div>

              <div className="grid grid-cols-7 gap-1.5 sm:gap-2">{cells}</div>
            </div>
          </div>

          <div className="mt-4 pt-3 border-t border-[#222222] flex flex-col sm:flex-row items-center justify-between gap-3 text-[11px] font-mono-tag text-[#888888] uppercase tracking-wider">
            <div className="flex items-center gap-2">
              <Icons.Info className="w-3.5 h-3.5 text-[#D4FF00] shrink-0" />
              <span>
                CADENCE: <strong className="text-white">2 VIDEOS / WEEK PER ACCOUNT</strong> (NO DAY COLLISION)

            <div className="flex items-center gap-3">
              <span className="flex items-center gap-1.5 text-[#FF8A00] font-bold">

              </span>
              <span className="flex items-center gap-1.5 text-[#FF2E93] font-bold">
                <span className="w-2 h-2 bg-[#FF2E93]"></span> AASHNA BOUTIQUE
              </span>
            </div>
          </div>
        </div>
      );
    }

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [isLoading, setIsLoading] = useState(true);
      const [lastFetchedAt, setLastFetchedAt] = useState(null);
      const [isFallback, setIsFallback] = useState(false);
      const [autoSyncInterval, setAutoSyncInterval] = useState(60);
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [selectedEmptySlot, setSelectedEmptySlot] = useState(null);
      const [showSyncMenu, setShowSyncMenu] = useState(false);
      const [toastMessage, setToastMessage] = useState(null);

      const triggerToast = (msg) => {
        setToastMessage(msg);
      };

      useEffect(() => {
        if (!toastMessage) return;
        const timer = setTimeout(() => setToastMessage(null), 3000);
        return () => clearTimeout(timer);
      }, [toastMessage]);

      const loadData = useCallback(async () => {
        setIsLoading(true);
        try {
          const res = await fetchLiveSheetData();
          setEvents(res.events);
          setMonths(res.months);
          setLastFetchedAt(res.fetchedAt);
          setIsFallback(res.isFallback);
        } catch (e) {
          console.error(e);
        } finally {
          setIsLoading(false);
        }
      }, []);

      useEffect(() => {
        loadData();
      }, [loadData]);

      // Auto-sync polling timer
      useEffect(() => {
        if (autoSyncInterval === 0) return;
        const intervalId = setInterval(() => {
          loadData();
        }, autoSyncInterval * 1000);
        return () => clearInterval(intervalId);
      }, [autoSyncInterval, loadData]);

      const activeMonthMeta = months[currentMonthIndex] || {
        key: 'default',
        year: 2026,
        month: 7,
        label: 'August 2026',
        monthName: 'August',

        dkCount: 0,
        abCount: 0,
        postedCount: 0,
        editedCount: 0,
        plannedCount: 0,
        emptyCount: 0,
      };

      const handleJumpToToday = () => {
        const today = new Date();
        const tMonth = today.getMonth();
        const tYear = today.getFullYear();
        const idx = months.findIndex((m) => m.year === tYear && m.month === tMonth);
        if (idx !== -1) {
          setCurrentMonthIndex(idx);
          triggerToast(`Switched view to ${months[idx].label}`);
        } else {
          // If current calendar year isn't today's, jump to closest month in dataset
          setCurrentMonthIndex(0);
          triggerToast(`Opened active production month: ${months[0]?.label || 'Active'}`);

      };

        let list = [...events];

          list = list.filter((e) => e.brandKey === brandFilter);

        if (statusFilter !== 'all') {
          list = list.filter((e) => {
            const s = (e.status || '').toLowerCase();

                          <button
                            key={option.value}
                            onClick={() => {
                              setAutoSyncInterval(option.value);
                              setShowSyncMenu(false);
                            }}
                            className={`w-full text-left px-2.5 py-1.5 text-[11px] font-bold uppercase tracking-wider flex items-center justify-between transition ${
                              autoSyncInterval === option.value ? 'bg-[#262626] text-[#D4FF00]' : 'text-[#888888] hover:bg-[#222222] hover:text-white'
                            }`}
                          >
                            <span>{option.label}</span>
                            {autoSyncInterval === option.value && <span className="w-1.5 h-1.5 rounded-full bg-[#D4FF00]"></span>}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  <button
                    onClick={() => {
                      loadData();
                      triggerToast('Syncing with Google Spreadsheet...');
                    }}
                    disabled={isLoading}
                    className={`px-3 sm:px-3.5 py-1.5 text-[11px] font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition cursor-pointer active:scale-95 ${
                      isLoading ? 'bg-[#181818] text-[#888888] border border-[#333333] cursor-not-allowed' : 'bg-[#D4FF00] hover:bg-[#c2ea00] text-[#0C0C0C] border border-[#D4FF00] font-black glow-accent'
                    }`}
                  >
                    <Icons.RefreshCw className={`w-3.5 h-3.5 ${isLoading ? 'animate-spin text-[#D4FF00]' : 'text-black'}`} />
                    <span>{isLoading ? 'SYNCING...' : 'SYNC SHEET'}</span>
                  </button>

                  <a
                    href={GOOGLE_SHEET_VIEW_URL}
                    target="_blank"
                    rel="noopener noreferrer"
                    className="px-2.5 sm:px-3 py-1.5 bg-[#181818] hover:bg-[#222222] text-[#888888] hover:text-[#D4FF00] border border-[#2A2A2A] text-[11px] font-bold uppercase tracking-wider flex items-center justify-center gap-1.5 transition"
                  >
                    <Icons.FileSpreadsheet className="w-3.5 h-3.5" />
                    <span>G-SHEET</span>
                  </a>
                </div>
              </div>

              <div className="mt-2.5 pt-2 border-t border-[#1C1C1C] flex items-center justify-between text-[10px] font-mono-tag text-[#888888] flex-wrap gap-2 uppercase tracking-wider">
                <div className="flex items-center gap-2">
                  <span className="w-1.5 h-1.5 rounded-full bg-[#44FF44] pulse-green"></span>
                  <span>SOURCE: <span className="text-[#FFFFFF]">G-SHEET / PUB?GID=0</span></span>
                  {isFallback && <span className="text-[#D4FF00] bg-[#181818] px-1.5 py-0.5 border border-[#333333]">CACHED DATA</span>}
                </div>
                <div className="flex items-center gap-3">
                  <span>POST COUNT: <strong className="text-[#D4FF00] font-black">{events.length}</strong></span>
                  <span className="text-[#333333]">/</span>
                  <span>LAST SYNC: <strong className="text-[#FFFFFF]">{formatLastSync(lastFetchedAt)}</strong></span>
                </div>
              </div>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-4 sm:space-y-6">
            
            {/* Stats Cards */}
            <div className="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 font-mono-tag">
              <div className="bg-[#181818] border border-[#332211] p-4 relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-[#FF8A00] flex items-center gap-1.5">
                    <Icons.Utensils className="w-3.5 h-3.5" /> DELICIOUS KITCHEN
                  </span>
                  <span className="px-1.5 py-0.5 text-[9px] font-bold bg-[#2a1a0c] text-[#FF8A00] border border-[#442a10]">2/WK</span>
                </div>
                <div className="mt-3 flex items-baseline gap-2">
                  <span className="font-editorial text-4xl italic font-normal text-white">{dkEvents}</span>
                  <span className="text-[10px] text-[#888888] uppercase">TOTAL VIDEOS</span>
                </div>
                <div className="mt-2 text-[10px] text-[#888888] uppercase tracking-wide">
                  {activeMonthMeta.monthName}: <strong className="text-[#FF8A00]">{activeMonthMeta.dkCount} POSTS</strong>
                </div>
              </div>

              <div className="bg-[#181818] border border-[#331122] p-4 relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-[#FF2E93] flex items-center gap-1.5">
                    <Icons.Sparkle className="w-3.5 h-3.5" /> AASHNA BOUTIQUE
                  </span>
                  <span className="px-1.5 py-0.5 text-[9px] font-bold bg-[#2a0c1a] text-[#FF2E93] border border-[#44102a]">2/WK</span>
                </div>
                <div className="mt-3 flex items-baseline gap-2">
                  <span className="font-editorial text-4xl italic font-normal text-white">{abEvents}</span>
                  <span className="text-[10px] text-[#888888] uppercase">TOTAL VIDEOS</span>
                </div>
                <div className="mt-2 text-[10px] text-[#888888] uppercase tracking-wide">
                  {activeMonthMeta.monthName}: <strong className="text-[#FF2E93]">{activeMonthMeta.abCount} POSTS</strong>
                </div>
              </div>

              <div className="bg-[#181818] border border-[#262626] p-4 relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-[#D4FF00] flex items-center gap-1.5">
                    <Icons.ShieldCheck className="w-3.5 h-3.5" /> CADENCE COLLISION
                  </span>
                  <span className="px-1.5 py-0.5 text-[9px] font-bold bg-[#102414] text-[#44FF44] border border-[#225522]">STRICT</span>
                </div>
                <div className="mt-3 flex items-baseline gap-2">
                  <span className="font-editorial text-4xl italic font-normal text-[#44FF44]">0</span>
                  <span className="text-[10px] text-[#888888] uppercase">CONFLICTS</span>
                </div>
                <div className="mt-2 text-[10px] text-[#888888] uppercase tracking-wide">100% NON-OVERLAPPING DUAL-BRAND</div>
              </div>

              <div className="bg-[#181818] border border-[#262626] p-4 relative overflow-hidden">
                <div className="flex items-center justify-between">
                  <span className="text-[11px] font-bold uppercase tracking-wider text-white flex items-center gap-1.5">
                    <Icons.TrendingUp className="w-3.5 h-3.5 text-[#D4FF00]" /> PIPELINE
                  </span>
                  <span className="text-xs font-bold text-[#D4FF00]">{filledPercent}%</span>
                </div>
                <div className="mt-3.5 h-2 w-full bg-[#0C0C0C] overflow-hidden flex gap-0.5 p-0.5 border border-[#2A2A2A]">
                  <div style={{ width: `${postedPercent}%` }} className="h-full bg-[#44FF44] transition-all" />
                  <div style={{ width: `${editedPercent}%` }} className="h-full bg-[#00E5FF] transition-all" />
                  <div style={{ width: `${filledPercent - postedPercent - editedPercent}%` }} className="h-full bg-[#D4FF00] transition-all" />
                </div>
                <div className="mt-2.5 flex items-center justify-between text-[9px] text-[#888888] uppercase">
                  <span className="text-[#44FF44]">POSTED: {postedCount}</span>
                  <span className="text-[#00E5FF]">EDITED: {editedCount}</span>
                  <span className="text-[#D4FF00]">NEED: {needIdeaCount}</span>
                </div>
              </div>
            </div>

            {/* Controls Bar */}
            <div className="w-full space-y-3 font-mono-tag">
              <div className="bg-[#181818] border border-[#262626] p-3 sm:p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3 sm:gap-4">
                
                {/* Stepper + Month Pills */}
                <div className="flex flex-col sm:flex-row sm:items-center gap-2.5 sm:gap-3 min-w-0 flex-1 w-full">
                  <div className="flex items-center justify-between sm:justify-start gap-2 shrink-0">
                    <div className="flex items-center bg-[#0C0C0C] border border-[#2A2A2A] shrink-0">
                      <button
                        onClick={() => setCurrentMonthIndex(Math.max(0, currentMonthIndex - 1))}
                        disabled={currentMonthIndex === 0}
                        className={`p-2 sm:p-2.5 text-[#888888] transition ${currentMonthIndex === 0 ? 'opacity-30 cursor-not-allowed text-[#444444]' : 'hover:bg-[#222222] hover:text-white'}`}
                        title="Previous month"
                      >
                        <Icons.ChevronLeft className="w-4 h-4" />
                      </button>
                      <div className="px-3 py-1.5 flex items-center gap-2 border-x border-[#2A2A2A]">
                        <span className="text-xs font-bold text-[#D4FF00] tracking-widest uppercase">{activeMonthMeta.label}</span>
                      </div>
                      <button
                        onClick={() => setCurrentMonthIndex(Math.min(months.length - 1, currentMonthIndex + 1))}
                        disabled={currentMonthIndex >= months.length - 1}
                        className={`p-2 sm:p-2.5 text-[#888888] transition ${currentMonthIndex >= months.length - 1 ? 'opacity-30 cursor-not-allowed text-[#444444]' : 'hover:bg-[#222222] hover:text-white'}`}
                        title="Next month"
                      >
                        <Icons.ChevronRight className="w-4 h-4" />
                      </button>
                    </div>

                    <button
                      onClick={handleJumpToToday}
                      className="px-2.5 py-1.5 sm:py-2 bg-[#0C0C0C] hover:bg-[#222222] text-[#D4FF00] border border-[#2A2A2A] hover:border-[#D4FF00] text-[10px] font-black uppercase tracking-widest shrink-0 transition"
                    >
                      TODAY
                    </button>
                  </div>

                  <div className="flex items-center gap-1.5 overflow-x-auto min-w-0 flex-1 pb-1.5 pt-0.5 custom-scrollbar w-full">
                    {months.map((m, idx) => {
                      const isActive = idx === currentMonthIndex;
                      return (
                        <button
                          key={m.key}
                          onClick={() => setCurrentMonthIndex(idx)}
                          className={`px-3 py-1.5 text-xs uppercase tracking-wider font-bold whitespace-nowrap transition-all flex items-center gap-2 border shrink-0 ${
                            isActive ? 'bg-[#D4FF00] text-[#0C0C0C] border-[#D4FF00] font-black' : 'bg-[#0C0C0C] hover:bg-[#222222] text-[#888888] hover:text-white border-[#2A2A2A]'
                          }`}
                        >
                          <span>{m.monthName}</span>
                          <span className={`text-[10px] px-1 py-0.2 font-bold ${isActive ? 'bg-black/20 text-black' : 'bg-[#181818] text-[#888888]'}`}>{m.totalEvents}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Brand Filter Buttons */}
                <div className="flex items-center gap-1.5 sm:gap-2 overflow-x-auto custom-scrollbar w-full lg:w-auto pb-1 sm:pb-0 shrink-0">
                  <div className="text-[10px] text-[#888888] font-bold uppercase tracking-widest flex items-center gap-1 mr-1 hidden sm:flex">
                    <Icons.Filter className="w-3 h-3 text-[#D4FF00]" />
                    <span>FILTER:</span>
                  </div>

                  <button
                    onClick={() => setBrandFilter('all')}
                    className={`px-3 py-1.5 sm:px-3.5 sm:py-2 text-[11px] sm:text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 sm:gap-2 shrink-0 justify-center border ${
                      brandFilter === 'all' ? 'bg-white text-black border-white font-black' : 'bg-[#0C0C0C] text-[#888888] hover:text-white hover:bg-[#222222] border-[#2A2A2A]'
                    }`}
                  >
                    <Icons.Layers className="w-3.5 h-3.5" />
                    <span>ALL BRANDS</span>
                    <span className="text-[10px] px-1.5 py-0.2 bg-[#222222] text-[#888888]">{events.length}</span>
                  </button>

                  <button
                    onClick={() => setBrandFilter('dk')}
                    className={`px-3 py-1.5 sm:px-3.5 sm:py-2 text-[11px] sm:text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 sm:gap-2 shrink-0 justify-center border ${
                      brandFilter === 'dk' ? 'bg-[#FF8A00] text-black border-[#FF8A00] font-black glow-dk' : 'bg-[#0C0C0C] text-[#FF8A00]/70 hover:text-[#FF8A00] hover:bg-[#222222] border-[#332211]'
                    }`}
                  >
                    <Icons.Utensils className="w-3.5 h-3.5" />
                    <span>DELICIOUS KITCHEN</span>
                    <span className={`text-[10px] px-1.5 py-0.2 ${brandFilter === 'dk' ? 'bg-black/30 text-black font-bold' : 'bg-[#181818] text-[#FF8A00]'}`}>{dkEvents}</span>
                  </button>

                  <button
                    onClick={() => setBrandFilter('ab')}
                    className={`px-3 py-1.5 sm:px-3.5 sm:py-2 text-[11px] sm:text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1.5 sm:gap-2 shrink-0 justify-center border ${
                      brandFilter === 'ab' ? 'bg-[#FF2E93] text-white border-[#FF2E93] font-black glow-ab' : 'bg-[#0C0C0C] text-[#FF2E93]/70 hover:text-[#FF2E93] hover:bg-[#222222] border-[#331122]'
                    }`}
                  >
                    <Icons.Sparkle className="w-3.5 h-3.5" />
                    <span>AASHNA BOUTIQUE</span>
                    <span className={`text-[10px] px-1.5 py-0.2 ${brandFilter === 'ab' ? 'bg-black/30 text-white font-bold' : 'bg-[#181818] text-[#FF2E93]'}`}>{abEvents}</span>
                  </button>
                </div>
              </div>

              {/* View Switcher, Status Quick-Chips, & Search */}
              <div className="bg-[#141414] border border-[#222222] p-2.5 sm:px-4 flex flex-col xl:flex-row items-stretch xl:items-center justify-between gap-3 text-xs">
                
                {/* 4 View Modes */}
                <div className="flex items-center bg-[#0C0C0C] border border-[#2A2A2A] overflow-x-auto custom-scrollbar w-full xl:w-auto shrink-0 pb-0.5 xl:pb-0">
                  <button
                    onClick={() => setViewMode('month')}
                    className={`px-2.5 sm:px-3 py-1.5 uppercase tracking-wider font-bold flex items-center gap-1.5 transition text-[11px] shrink-0 whitespace-nowrap ${
                      viewMode === 'month' ? 'bg-[#D4FF00] text-[#0C0C0C] font-black' : 'text-[#888888] hover:text-white hover:bg-[#181818]'
                    }`}
                  >
                    <Icons.Calendar className="w-3.5 h-3.5" />
                    <span><span className="hidden sm:inline">MONTH </span>GRID</span>
                  </button>

                  <button
                    onClick={() => setViewMode('two-month')}
                    className={`px-2.5 sm:px-3 py-1.5 uppercase tracking-wider font-bold flex items-center gap-1.5 transition text-[11px] shrink-0 whitespace-nowrap ${
                      viewMode === 'two-month' ? 'bg-[#D4FF00] text-[#0C0C0C] font-black' : 'text-[#888888] hover:text-white hover:bg-[#181818]'
                    }`}
                  >
                    <Icons.Columns2 className="w-3.5 h-3.5" />
                    <span>BI-MONTH<span className="hidden sm:inline"> VIEW</span></span>
                  </button>

                  <button
                    onClick={() => setViewMode('kanban')}
                    className={`px-2.5 sm:px-3 py-1.5 uppercase tracking-wider font-bold flex items-center gap-1.5 transition text-[11px] shrink-0 whitespace-nowrap ${
                      viewMode === 'kanban' ? 'bg-[#D4FF00] text-[#0C0C0C] font-black' : 'text-[#888888] hover:text-white hover:bg-[#181818]'
                    }`}
                  >
                    <Icons.LayoutGrid className="w-3.5 h-3.5" />
                    <span>KANBAN<span className="hidden sm:inline"> PIPELINE</span></span>
                  </button>

                  <button
                    onClick={() => setViewMode('queue')}
                    className={`px-2.5 sm:px-3 py-1.5 uppercase tracking-wider font-bold flex items-center gap-1.5 transition text-[11px] shrink-0 whitespace-nowrap ${
                      viewMode === 'queue' ? 'bg-[#D4FF00] text-[#0C0C0C] font-black' : 'text-[#888888] hover:text-white hover:bg-[#181818]'
                    }`}
                  >
                    <Icons.List className="w-3.5 h-3.5" />
                    <span>QUEUE<span className="hidden sm:inline"> TABLE</span></span>
                  </button>
                </div>

                {/* Status Quick-Filter Chips */}
                <div className="flex items-center gap-1.5 overflow-x-auto w-full xl:w-auto pb-1 xl:pb-0 custom-scrollbar shrink-0">
                  {[
                    { id: 'all', label: 'ALL', count: events.length, color: 'text-white' },
                    { id: 'Posted', label: 'POSTED', count: postedCount, color: 'text-[#44FF44]' },
                    { id: 'Edited', label: 'EDITED', count: editedCount, color: 'text-[#00E5FF]' },
                    { id: 'Planned', label: 'PLANNED', count: plannedCount, color: 'text-[#AAAAAA]' },
                    { id: 'Idea Needed', label: 'IDEA NEEDED', count: needIdeaCount, color: 'text-[#D4FF00]' },
                  ].map((s) => (
                    <button
                      key={s.id}
                      onClick={() => setStatusFilter(s.id)}
                      className={`px-2 py-1 text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 border whitespace-nowrap transition shrink-0 ${
                        statusFilter === s.id
                          ? 'bg-[#262626] border-[#D4FF00] text-white ring-1 ring-[#D4FF00]'
                          : 'bg-[#0C0C0C] border-[#222222] text-[#777777] hover:text-white hover:bg-[#181818]'
                      }`}
                    >
                      <span className={s.color}>{s.label}</span>
                      <span className="text-[9px] px-1 py-0.2 bg-black/40 text-white/70">{s.count}</span>
                    </button>
                  ))}
                </div>

                {/* Search Box */}
                <div className="relative w-full xl:w-56">
                  <Icons.Search className="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-[#666666]" />
                  <input
                    type="text"
                    placeholder="SEARCH TOPIC / BRAND..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-[#0C0C0C] border border-[#2A2A2A] text-white pl-8 pr-3 py-1.5 text-[11px] uppercase placeholder:text-[#555555] focus:outline-none focus:border-[#D4FF00]"
                  />
                </div>
              </div>
            </div>

            {/* Views */}
            {isLoading && events.length === 0 ? (
              <div className="w-full bg-[#141414] border border-[#222222] p-16 flex flex-col items-center justify-center text-center space-y-4 font-mono-tag">
                <Icons.RefreshCw className="w-6 h-6 text-[#D4FF00] animate-spin" />
                <div>
                  <h3 className="text-sm font-bold text-white uppercase tracking-wider">CONNECTING TO GOOGLE SPREADSHEET...</h3>
                  <p className="text-xs text-[#888888] mt-1">Parsing real-time publishing dates and brand schedules.</p>
                </div>
              </div>
            ) : viewMode === 'month' ? (
              <MonthCalendarGrid
                monthMeta={activeMonthMeta}
                events={filteredEvents}
                brandFilter={brandFilter}
                onSelectEvent={(ev) => setSelectedEvent(ev)}
                onSelectEmptySlot={(slot) => setSelectedEmptySlot(slot)}
              />
            ) : viewMode === 'two-month' ? (
              <div className="space-y-6">
                <div className="flex items-center justify-between bg-[#141414] p-3 px-4 border border-[#222222] text-[#888888] text-[11px] font-mono-tag uppercase tracking-wider">
                  <div className="flex items-center gap-2">
                    <span className="w-1.5 h-1.5 bg-[#D4FF00] pulse-dot"></span>
                    <span className="font-bold text-white">BI-MONTH DUAL GRID:</span>
                    <span className="text-[#D4FF00] font-bold">{activeMonthMeta.label}</span>
                  </div>
                  <div className="text-[#666666] hidden md:block">CONSECUTIVE MULTI-MONTH PRODUCTION TIMELINE</div>
                </div>

                <div className="grid grid-cols-1 xl:grid-cols-2 gap-6 items-start">
                  <div className="space-y-3">
                    <div className="flex items-center justify-between px-1 font-mono-tag">
                      <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                        <span className="w-2 h-2 bg-[#D4FF00]"></span>
                        {activeMonthMeta.label}
                      </h3>
                      <span className="text-[10px] text-[#888888] bg-[#181818] border border-[#2A2A2A] px-2 py-0.5 font-bold uppercase">{activeMonthMeta.totalEvents} POSTS</span>
                    </div>
                    <MonthCalendarGrid
                      monthMeta={activeMonthMeta}
                      events={filteredEvents}
                      brandFilter={brandFilter}
                      onSelectEvent={(ev) => setSelectedEvent(ev)}
                      onSelectEmptySlot={(slot) => setSelectedEmptySlot(slot)}
                    />
                  </div>

                  {months[currentMonthIndex + 1] && (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between px-1 font-mono-tag">
                        <h3 className="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
                          <span className="w-2 h-2 bg-[#FF2E93]"></span>
                          {months[currentMonthIndex + 1].label}
                        </h3>
                        <span className="text-[10px] text-[#888888] bg-[#181818] border border-[#2A2A2A] px-2 py-0.5 font-bold uppercase">{months[currentMonthIndex + 1].totalEvents} POSTS</span>
                      </div>
                      <MonthCalendarGrid
                        monthMeta={months[currentMonthIndex + 1]}
                        events={filteredEvents}
                        brandFilter={brandFilter}
                        onSelectEvent={(ev) => setSelectedEvent(ev)}
                        onSelectEmptySlot={(slot) => setSelectedEmptySlot(slot)}
                      />
                    </div>
                  )}
                </div>
              </div>
            ) : viewMode === 'kanban' ? (
              <KanbanBoard
                events={filteredEvents}
                onSelectEvent={(ev) => setSelectedEvent(ev)}
              />
            ) : (
              <QueueTable
                events={filteredEvents}
                activeMonthMeta={activeMonthMeta}
                brandFilter={brandFilter}
                onSelectEvent={(ev) => setSelectedEvent(ev)}
              />
            )}
          </main>

          {/* Footer */}
          <footer className="w-full border-t border-[#1C1C1C] bg-[#0C0C0C] py-5 px-4 text-center text-xs text-[#888888] font-mono-tag">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="w-1.5 h-1.5 bg-[#44FF44] pulse-dot"></span>
                <span className="text-[11px] uppercase tracking-wider">LIVE GOOGLE SPREADSHEET SYNC ENGINE ACTIVE</span>
              </div>
              <p className="text-[10px] text-[#666666] uppercase tracking-wider">
                PUBLISHING CADENCE: 2 VIDEOS/WEEK PER BRAND • DELICIOUS KITCHEN & AASHNA BOUTIQUE
              </p>
            </div>
          </footer>

          {/* Event Detail Modal */}
          {selectedEvent && (
            <EventDetailModal
              event={selectedEvent}
              onClose={() => setSelectedEvent(null)}
              onNotify={triggerToast}
            />
          )}

          {/* Schedule Empty Slot Modal */}
          {selectedEmptySlot && (
            <ScheduleSlotModal
              slot={selectedEmptySlot}
              onClose={() => setSelectedEmptySlot(null)}
              onNotify={triggerToast}
            />
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
