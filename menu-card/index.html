<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Designer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ink:       #1a1208;
            --ink-light: #4a3f2f;
            --gold:      #b8892a;
            --gold-lt:   #e8c97a;
            --cream:     #fdf8f0;
            --cream-dk:  #f5ede0;
            --border:    #d6c9b0;
            --ui-bg:     #fafaf8;
            --ui-card:   #ffffff;
            --ui-border: #e8e4de;
            --ui-text:   #2c2416;
            --ui-muted:  #8a7d6a;
            --accent:    #c0392b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #f0ece4;
            margin: 0;
            min-height: 100vh;
        }

        /* ─── APP SHELL ─── */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        /* ─── LEFT PANEL ─── */
        .left-panel {
            width: 420px;
            min-width: 420px;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
        }
        .left-panel::-webkit-scrollbar { width: 4px; }
        .left-panel::-webkit-scrollbar-thumb { background: #3a2e20; border-radius: 2px; }

        .panel-header {
            padding: 28px 28px 20px;
            border-bottom: 1px solid #2e261a;
        }
        .panel-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }
        .logo-icon {
            width: 32px; height: 32px;
            background: var(--gold);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-icon svg { width: 18px; height: 18px; fill: var(--ink); }
        .panel-title {
            font-family: 'Georgia', serif;
            font-size: 1.15rem;
            font-weight: bold;
            color: #f5ede0;
            letter-spacing: 0.05em;
        }
        .panel-subtitle { font-size: 0.72rem; color: #7a6a52; font-family: Arial, sans-serif; letter-spacing: 0.04em; }

        .panel-body { padding: 20px 24px 32px; display: flex; flex-direction: column; gap: 20px; }

        /* Step Cards */
        .step-card {
            background: #22190e;
            border: 1px solid #2e261a;
            border-radius: 10px;
            overflow: hidden;
        }
        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px 16px;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .step-card.open .step-header { border-bottom-color: #2e261a; }
        .step-num {
            width: 22px; height: 22px; min-width: 22px;
            background: var(--gold);
            color: var(--ink);
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            font-family: Arial, sans-serif;
        }
        .step-label {
            color: #e8d8bc;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            flex-grow: 1;
        }
        .step-chevron {
            width: 16px; height: 16px;
            fill: none;
            stroke: #7a6a52;
            stroke-width: 2;
            transition: transform 0.25s;
        }
        .step-card.open .step-chevron { transform: rotate(180deg); }
        .step-body {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(.4,0,.2,1);
        }
        .step-card.open .step-body { max-height: 1200px; }
        .step-inner { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        /* Form Fields */
        .field-label {
            display: block;
            font-size: 0.68rem;
            color: #9a8a72;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
            font-weight: 600;
        }
        .field-input {
            width: 100%;
            background: #1a1208;
            border: 1px solid #3a2e20;
            color: #f0e0c0;
            font-family: Georgia, serif;
            font-size: 0.85rem;
            padding: 9px 12px;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px rgba(184,137,42,0.15);
        }
        .field-input::placeholder { color: #5a4e3a; }
        textarea.field-input { resize: vertical; min-height: 60px; }
        select.field-input { cursor: pointer; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Timing mini-grid */
        .timing-group {
            background: #1a1208;
            border: 1px solid #2e261a;
            border-radius: 7px;
            padding: 10px 12px;
        }
        .timing-group-title {
            font-size: 0.65rem;
            color: var(--gold);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            font-weight: 700;
            margin-bottom: 8px;
        }

        /* Item cards */
        .item-card {
            background: #1a1208;
            border: 1px solid #2e261a;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            animation: slideIn 0.2s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .item-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .cat-badge {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .cat-badge.Breakfast { background: #3a2800; color: #ffb347; }
        .cat-badge.Lunch     { background: #002a1a; color: #4ade80; }
        .cat-badge.Dinner    { background: #1a0028; color: #c084fc; }
        .remove-btn {
            background: none;
            border: none;
            color: #5a4e3a;
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 5px;
            border-radius: 4px;
            transition: color 0.15s, background 0.15s;
            font-family: Arial, sans-serif;
        }
        .remove-btn:hover { color: #ef4444; background: #2e0808; }

        .item-row { display: flex; gap: 8px; }
        .item-name-input { flex: 3; }
        .item-price-input { flex: 1; }

        /* Social row */
        .social-row { display: flex; gap: 8px; align-items: center; }
        .social-row select { flex: 0 0 120px; }
        .social-row input { flex: 1; }
        .social-row .remove-btn { flex: 0 0 auto; }

        /* Add buttons */
        .add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 9px;
            border: 1.5px dashed #3a2e20;
            background: transparent;
            color: var(--gold);
            border-radius: 7px;
            font-size: 0.78rem;
            font-family: Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-btn:hover { border-color: var(--gold); background: rgba(184,137,42,0.07); }

        /* Theme Switcher */
        .theme-switcher {
            display: flex;
            gap: 8px;
        }
        .theme-btn {
            flex: 1;
            padding: 8px 6px;
            border-radius: 7px;
            border: 1.5px solid #3a2e20;
            background: #1a1208;
            color: #9a8a72;
            font-size: 0.7rem;
            font-family: Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .theme-btn .swatch {
            width: 20px; height: 12px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .theme-btn:hover { border-color: var(--gold); color: var(--gold-lt); }
        .theme-btn.active { border-color: var(--gold); background: #2a1e08; color: var(--gold-lt); }

        /* ─── RIGHT PANEL ─── */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 36px 40px;
            overflow-y: auto;
            background: #e8e2d8;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(184,137,42,0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(192,57,43,0.04) 0%, transparent 50%);
        }

        .preview-header {
            width: 100%;
            max-width: 820px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }
        .preview-badge {
            display: flex;
            align-items: center;
            gap: 7px;
            font-family: Arial, sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #7a6a52;
        }
        .live-dot {
            width: 7px; height: 7px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.6; transform: scale(0.8); }
        }

        /* Export Button */
        .export-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--gold) 0%, #9a6e1a 100%);
            color: #1a1208;
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            font-family: Arial, sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 14px rgba(184,137,42,0.35);
        }
        .export-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(184,137,42,0.45);
        }
        .export-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .export-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.5; }
        .spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(26,18,8,0.3);
            border-top-color: #1a1208;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Preview canvas wrap */
        .preview-canvas-wrap {
            width: 100%;
            max-width: 820px;
            background: #d0c9bc;
            border-radius: 12px;
            padding: 28px;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.5) inset,
                0 20px 60px rgba(0,0,0,0.15),
                0 4px 12px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
            overflow-x: auto;
        }

        /* ════════════════════════════════
           MENU PREVIEW STYLES
        ════════════════════════════════ */

        .menu-preview-wrapper {
            width: 760px;
            min-width: 760px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.06);
        }

        /* ── THEME: CLASSIC ── */
        .theme-classic .menu-paper {
            background: #fdf8f0;
            color: #1a1208;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .theme-classic .menu-outer-border {
            border: 3px double #b8892a;
            padding: 6px;
        }
        .theme-classic .menu-inner-border {
            border: 1px solid #b8892a;
            padding: 32px 64px 28px;
            min-height: 860px;
            display: flex;
            flex-direction: column;
        }
        .theme-classic .menu-title {
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #1a1208;
            line-height: 1.1;
        }
        .theme-classic .menu-ornament { color: #b8892a; }
        .theme-classic .menu-tagline { color: #4a3f2f; }
        .theme-classic .menu-date    { color: #7a6a52; }
        .theme-classic .menu-header-rule { border-color: #b8892a; }
        .theme-classic .category-title { color: #b8892a; border-bottom: 1px solid #d6c9b0; }
        .theme-classic .category-meta  { color: #7a6a52; }
        .theme-classic .item-name      { color: #1a1208; }
        .theme-classic .item-price     { color: #1a1208; }
        .theme-classic .item-desc      { color: #7a6a52; }
        .theme-classic .menu-footer-rule { border-color: #d6c9b0; }
        .theme-classic .social-handle { color: #1a1208; }
        .theme-classic .social-handle svg { fill: #b8892a; }

        /* ── THEME: MODERN ── */
        .theme-modern .menu-paper {
            background: #ffffff;
            color: #111111;
            font-family: 'Georgia', serif;
        }
        .theme-modern .menu-outer-border {
            border: 1px solid #e0e0e0;
            padding: 0;
        }
        .theme-modern .menu-inner-border {
            border: none;
            border-top: 4px solid #111111;
            padding: 32px 64px 28px;
            min-height: 860px;
            display: flex;
            flex-direction: column;
        }
        .theme-modern .menu-title {
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #111111;
        }
        .theme-modern .menu-ornament { color: #e0e0e0; }
        .theme-modern .menu-tagline { color: #555; }
        .theme-modern .menu-date    { color: #888; }
        .theme-modern .menu-header-rule { border-color: #e0e0e0; border-width: 1px; }
        .theme-modern .category-title { color: #111; border-bottom: 2px solid #111; }
        .theme-modern .category-meta  { color: #888; }
        .theme-modern .item-name  { color: #111; }
        .theme-modern .item-price { color: #111; }
        .theme-modern .item-desc  { color: #888; }
        .theme-modern .menu-footer-rule { border-color: #e0e0e0; }
        .theme-modern .social-handle { color: #111; }
        .theme-modern .social-handle svg { fill: #111; }

        /* ── THEME: BISTRO ── */
        .theme-bistro .menu-paper {
            background: #1e1510;
            color: #f0e0c0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .theme-bistro .menu-outer-border {
            border: 1px solid #4a3620;
            padding: 6px;
        }
        .theme-bistro .menu-inner-border {
            border: 1px solid #3a2a14;
            padding: 32px 64px 28px;
            min-height: 860px;
            display: flex;
            flex-direction: column;
        }
        .theme-bistro .menu-title {
            font-size: 2.4rem;
            font-weight: bold;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #e8c97a;
        }
        .theme-bistro .menu-ornament { color: #e8c97a; }
        .theme-bistro .menu-tagline { color: #c0a870; }
        .theme-bistro .menu-date    { color: #8a7040; }
        .theme-bistro .menu-header-rule { border-color: #4a3620; }
        .theme-bistro .category-title { color: #e8c97a; border-bottom: 1px solid #3a2a14; }
        .theme-bistro .category-meta  { color: #8a7040; }
        .theme-bistro .item-name  { color: #f0e0c0; }
        .theme-bistro .item-price { color: #e8c97a; }
        .theme-bistro .item-desc  { color: #a09060; }
        .theme-bistro .menu-footer-rule { border-color: #3a2a14; }
        .theme-bistro .social-handle { color: #e8c97a; }
        .theme-bistro .social-handle svg { fill: #e8c97a; }

        /* ── Shared Menu Layout ── */
        .menu-header-block {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
        }
        .menu-ornament {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 10px;
            letter-spacing: 0.3em;
        }
        .menu-title {
            display: block;
            margin: 0 0 8px 0;
            line-height: 1.1;
        }
        .menu-tagline {
            font-size: 0.95rem;
            font-style: italic;
            display: block;
            margin: 0 0 6px;
        }
        .menu-date {
            font-size: 0.8rem;
            font-style: normal;
            display: block;
            letter-spacing: 0.06em;
        }
        .menu-header-rule {
            width: 100%;
            border: none;
            border-top: 1px solid;
            margin: 14px 0 0;
        }

        .menu-content { flex-grow: 1; }

        .category-block { margin-bottom: 28px; }
        .category-title {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            display: block;
            padding-bottom: 5px;
            margin-bottom: 6px;
        }
        .category-meta {
            font-size: 0.82rem;
            font-style: italic;
            display: flex;
            gap: 20px;
            margin-bottom: 14px;
        }

        /* Menu Item Row — FIXED alignment for PNG Export */
        .menu-item { margin-bottom: 14px; }
        .menu-item-row {
            display: flex;
            align-items: baseline;
            width: 100%;
        }
        .item-name {
            flex-shrink: 0;
            font-size: 1.05rem;
            font-weight: bold;
            padding-right: 8px;
        }
        .leader-cell {
            flex-grow: 1;
            margin-bottom: 0.25em; /* Aligns dots with text baseline */
        }
        .leader-dots {
            display: block;
            height: 0;
            width: 100%;
        }
        .theme-classic .leader-dots { border-top: 2px dotted #c8a050; }
        .theme-modern  .leader-dots { border-top: 2px dotted #bbbbbb; }
        .theme-bistro  .leader-dots { border-top: 2px dotted #5a4030; }
        .item-price {
            flex-shrink: 0;
            font-size: 1.05rem;
            font-weight: bold;
            padding-left: 8px;
            text-align: right;
        }
        .item-desc {
            font-size: 0.82rem;
            font-style: italic;
            line-height: 1.4;
            margin-top: 5px;
            max-width: 78%;
        }

        /* Footer */
        .menu-footer-block {
            margin-top: auto;
            padding-top: 16px;
        }
        .menu-footer-rule {
            border: none;
            border-top: 1px solid;
            margin-bottom: 14px;
        }
        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
        }
        .social-handle {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.82rem;
            font-weight: bold;
            line-height: 1;
        }
        .social-handle svg {
            width: 17px;
            height: 17px;
            display: block;
            flex-shrink: 0;
            position: relative;
            top: 0;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 900px) {
            .app-shell { flex-direction: column; }
            .left-panel { width: 100%; min-width: 0; height: auto; position: static; }
            .right-panel { padding: 24px 16px; }
            .preview-canvas-wrap { padding: 14px; }
            .menu-preview-wrapper { min-width: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- ════ LEFT PANEL ════ -->
    <div class="left-panel">
        <div class="panel-header">
            <div class="panel-logo">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h6"/><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="#1a1208" stroke-width="1.5"/></svg>
                </div>
                <div>
                    <div class="panel-title">MENU DESIGNER</div>
                    <div class="panel-subtitle">LIVE PREVIEW · PNG EXPORT</div>
                </div>
            </div>
        </div>

        <div class="panel-body">

            <!-- Step 1: Identity -->
            <div class="step-card open" id="step-1">
                <div class="step-header" onclick="toggleStep('step-1')">
                    <div class="step-num">1</div>
                    <div class="step-label">Restaurant Identity</div>
                    <svg class="step-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div>
                            <label class="field-label">Restaurant Name</label>
                            <input type="text" id="input-restaurant" placeholder="e.g. THE ROLLING CHAMMACH"
                                class="field-input" oninput="updatePreview()">
                        </div>
                        <div>
                            <label class="field-label">Tagline (Optional)</label>
                            <textarea id="input-tagline" rows="2" placeholder="e.g. Freshly Prepared · Homemade Taste"
                                class="field-input" oninput="updatePreview()"></textarea>
                        </div>
                        <div>
                            <label class="field-label">Second Tagline (Optional)</label>
                            <textarea id="input-tagline2" rows="2" placeholder="e.g. Order Today · Eat Healthy"
                                class="field-input" oninput="updatePreview()"></textarea>
                        </div>
                        <div>
                            <label class="field-label">Menu Date (Optional)</label>
                            <div style="position:relative;">
                                <input type="date" id="input-date" class="field-input" style="padding-right:38px;cursor:pointer;" oninput="updatePreview()" onchange="updatePreview()">
                                <svg style="position:absolute;right:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:#9a8a72;stroke-width:1.8;pointer-events:none;" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            </div>
                        </div>
                        <div>
                            <label class="field-label">Visual Theme</label>
                            <div class="theme-switcher">
                                <button class="theme-btn active" onclick="setTheme('classic', this)">
                                    <span class="swatch" style="background:#fdf8f0; border-color:#b8892a;"></span>
                                    Classic
                                </button>
                                <button class="theme-btn" onclick="setTheme('modern', this)">
                                    <span class="swatch" style="background:#fff; border-color:#111;"></span>
                                    Modern
                                </button>
                                <button class="theme-btn" onclick="setTheme('bistro', this)">
                                    <span class="swatch" style="background:#1e1510; border-color:#e8c97a;"></span>
                                    Bistro
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Timings -->
            <div class="step-card" id="step-2">
                <div class="step-header" onclick="toggleStep('step-2')">
                    <div class="step-num">2</div>
                    <div class="step-label">Meal Timings</div>
                    <svg class="step-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div class="timing-group">
                            <div class="timing-group-title">☀ Breakfast</div>
                            <div class="grid-2">
                                <div>
                                    <label class="field-label">Serving Time</label>
                                    <input type="text" id="time-breakfast" value="8 AM – 10 AM" class="field-input" oninput="updatePreview()">
                                </div>
                                <div>
                                    <label class="field-label">Pre-order By</label>
                                    <input type="text" id="pre-breakfast" value="11 PM (prev.)" class="field-input" oninput="updatePreview()">
                                </div>
                            </div>
                        </div>
                        <div class="timing-group">
                            <div class="timing-group-title">🌤 Lunch</div>
                            <div class="grid-2">
                                <div>
                                    <label class="field-label">Serving Time</label>
                                    <input type="text" id="time-lunch" value="1 PM – 3:30 PM" class="field-input" oninput="updatePreview()">
                                </div>
                                <div>
                                    <label class="field-label">Pre-order By</label>
                                    <input type="text" id="pre-lunch" value="11 PM (prev.)" class="field-input" oninput="updatePreview()">
                                </div>
                            </div>
                        </div>
                        <div class="timing-group">
                            <div class="timing-group-title">🌙 Dinner</div>
                            <div class="grid-2">
                                <div>
                                    <label class="field-label">Serving Time</label>
                                    <input type="text" id="time-dinner" value="8 PM – 10 PM" class="field-input" oninput="updatePreview()">
                                </div>
                                <div>
                                    <label class="field-label">Pre-order By</label>
                                    <input type="text" id="pre-dinner" value="12 PM (prev.)" class="field-input" oninput="updatePreview()">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: Menu Items -->
            <div class="step-card open" id="step-3">
                <div class="step-header" onclick="toggleStep('step-3')">
                    <div class="step-num">3</div>
                    <div class="step-label">Menu Items</div>
                    <svg class="step-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div id="items-container" style="display:flex;flex-direction:column;gap:10px;"></div>
                        <button class="add-btn" onclick="addItem()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Menu Item
                        </button>
                    </div>
                </div>
            </div>

            <!-- Step 4: Social -->
            <div class="step-card" id="step-4">
                <div class="step-header" onclick="toggleStep('step-4')">
                    <div class="step-num">4</div>
                    <div class="step-label">Social Media</div>
                    <svg class="step-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div id="socials-container" style="display:flex;flex-direction:column;gap:8px;"></div>
                        <button class="add-btn" onclick="addSocial()">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            Add Social Link
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div><!-- /left-panel -->

    <!-- ════ RIGHT PANEL ════ -->
    <div class="right-panel">

        <div class="preview-header">
            <div class="preview-badge">
                <div class="live-dot"></div>
                Live Preview
            </div>
            <button class="export-btn" id="download-btn" onclick="downloadPNG()">
                <div class="spinner" id="export-spinner"></div>
                <svg id="export-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span id="export-label">Export as PNG</span>
            </button>
        </div>

        <div class="preview-canvas-wrap">
            <!-- This is the export target -->
            <div id="menu-capture-area" class="menu-preview-wrapper theme-classic">
                <div class="menu-paper">
                    <div class="menu-outer-border">
                        <div class="menu-inner-border">

                            <!-- Header -->
                            <div class="menu-header-block">
                                <span id="preview-restaurant" class="menu-title">THE ROLLING CHAMMACH</span>
                                <span id="preview-tagline"  class="menu-tagline" style="display:none;"></span>
                                <span id="preview-tagline2" class="menu-tagline" style="display:none;"></span>
                                <span id="preview-date"     class="menu-date"    style="display:none;"></span>
                                <hr class="menu-header-rule">
                            </div>

                            <!-- Items -->
                            <div id="preview-items-list" class="menu-content"></div>

                            <!-- Footer -->
                            <div id="preview-footer" class="menu-footer-block" style="display:none;">
                                <hr class="menu-footer-rule">
                                <div id="preview-socials-list" class="social-links"></div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div><!-- /right-panel -->

</div><!-- /app-shell -->

<script>
    /* ── SVG icons ── */
    const SVGS = {
        Instagram: `<svg width="17" height="17" viewBox="0 0 24 24"><path d="M8 3C5.239 3 3 5.239 3 8v8c0 2.761 2.239 5 5 5h8c2.761 0 5-2.239 5-5V8c0-2.761-2.239-5-5-5H8zm10 2a1 1 0 110 2 1 1 0 010-2zM12 7a5 5 0 110 10A5 5 0 0112 7zm0 2a3 3 0 100 6 3 3 0 000-6z"/></svg>`,
        Facebook:  `<svg width="17" height="17" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/></svg>`,
        X:         `<svg width="17" height="17" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.737-8.835L1.254 2.25H8.08l4.263 5.634zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
        WhatsApp:  `<svg width="17" height="17" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`
    };

    let currentTheme = 'classic';

    function setTheme(theme, btn) {
        currentTheme = theme;
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const wrap = document.getElementById('menu-capture-area');
        wrap.className = `menu-preview-wrapper theme-${theme}`;
    }

    function toggleStep(id) {
        document.getElementById(id).classList.toggle('open');
    }

    function generateId() { return Math.random().toString(36).substr(2, 9); }

    let items = [
        { id: generateId(), category: 'Breakfast', name: 'Poha',                        price: '60',  desc: 'Light, fluffed rice flakes with onion & mustard seeds' },
        { id: generateId(), category: 'Breakfast', name: 'Upma',                         price: '55',  desc: '' },
        { id: generateId(), category: 'Lunch',     name: 'Quinoa Pulao with Curd',       price: '139', desc: 'Hearty seasonal vegetables, fragrant spices' },
        { id: generateId(), category: 'Dinner',    name: 'Dal Makhani with Roti (2)',     price: '175', desc: 'Slow-cooked black lentils, butter-finished' },
    ];

    let socials = [
        { id: generateId(), platform: 'Instagram', handle: '@yourrestaurant' }
    ];

    /* ── Render left-panel forms ── */
    function renderItemsForm() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';
        items.forEach(item => {
            const d = document.createElement('div');
            d.className = 'item-card';
            d.innerHTML = `
                <div class="item-card-top">
                    <select onchange="updateItemData('${item.id}','category',this.value);renderItemsForm();"
                        class="field-input" style="width:auto;padding:4px 8px;font-size:0.75rem;">
                        <option value="Breakfast" ${item.category==='Breakfast'?'selected':''}>Breakfast</option>
                        <option value="Lunch"     ${item.category==='Lunch'    ?'selected':''}>Lunch</option>
                        <option value="Dinner"    ${item.category==='Dinner'   ?'selected':''}>Dinner</option>
                    </select>
                    <button class="remove-btn" onclick="removeItem('${item.id}')">✕</button>
                </div>
                <div class="item-row">
                    <input type="text" value="${item.name}"  oninput="updateItemData('${item.id}','name',this.value)"
                        placeholder="Item Name" class="field-input item-name-input">
                    <input type="text" value="${item.price}" oninput="updateItemData('${item.id}','price',this.value)"
                        placeholder="₹" class="field-input item-price-input">
                </div>
                <input type="text" value="${item.desc}" oninput="updateItemData('${item.id}','desc',this.value)"
                    placeholder="Short description (optional)" class="field-input">
            `;
            container.appendChild(d);
        });
        updatePreview();
    }

    function renderSocialsForm() {
        const container = document.getElementById('socials-container');
        container.innerHTML = '';
        socials.forEach(s => {
            const d = document.createElement('div');
            d.className = 'social-row';
            d.innerHTML = `
                <select onchange="updateSocialData('${s.id}','platform',this.value)" class="field-input">
                    <option value="Instagram" ${s.platform==='Instagram'?'selected':''}>Instagram</option>
                    <option value="Facebook"  ${s.platform==='Facebook' ?'selected':''}>Facebook</option>
                    <option value="X"         ${s.platform==='X'        ?'selected':''}>X / Twitter</option>
                    <option value="WhatsApp"  ${s.platform==='WhatsApp' ?'selected':''}>WhatsApp</option>
                </select>
                <input type="text" value="${s.handle}" oninput="updateSocialData('${s.id}','handle',this.value)"
                    placeholder="@handle or number" class="field-input">
                <button class="remove-btn" onclick="removeSocial('${s.id}')">✕</button>
            `;
            container.appendChild(d);
        });
        updatePreview();
    }

    function addItem()         { items.push({ id: generateId(), category: 'Lunch', name: '', price: '', desc: '' }); renderItemsForm(); }
    function removeItem(id)    { items = items.filter(i => i.id !== id); renderItemsForm(); }
    function updateItemData(id, f, v) { const i = items.find(x => x.id===id); if(i) i[f]=v; updatePreview(); }
    function addSocial()       { socials.push({ id: generateId(), platform: 'Instagram', handle: '' }); renderSocialsForm(); }
    function removeSocial(id)  { socials = socials.filter(s => s.id !== id); renderSocialsForm(); }
    function updateSocialData(id, f, v) { const s = socials.find(x => x.id===id); if(s) s[f]=v; updatePreview(); }

    /* ── Live preview update ── */
    function updatePreview() {
        // Restaurant name
        const name = document.getElementById('input-restaurant').value.trim() || 'THE ROLLING CHAMMACH';
        document.getElementById('preview-restaurant').textContent = name;

        // Tagline
        const tval = document.getElementById('input-tagline').value.trim();
        const tel  = document.getElementById('preview-tagline');
        tel.textContent = tval; tel.style.display = tval ? '' : 'none';

        // Second Tagline
        const tval2 = document.getElementById('input-tagline2').value.trim();
        const tel2  = document.getElementById('preview-tagline2');
        tel2.textContent = tval2; tel2.style.display = tval2 ? '' : 'none';

        // Date
        const dval = document.getElementById('input-date').value;
        const del  = document.getElementById('preview-date');
        if (dval) {
            del.textContent = new Date(dval).toLocaleDateString('en-IN', { year:'numeric', month:'long', day:'numeric' });
            del.style.display = '';
        } else { del.style.display = 'none'; }

        // Items
        const list = document.getElementById('preview-items-list');
        list.innerHTML = '';

        const cats = [
            { id: 'Breakfast', label: 'Breakfast' },
            { id: 'Lunch',     label: 'Lunch'     },
            { id: 'Dinner',    label: 'Dinner'    },
        ];

        cats.forEach(cat => {
            const filtered = items.filter(i => i.category === cat.id && (i.name || i.price));
            if (!filtered.length) return;

            const time = document.getElementById(`time-${cat.id.toLowerCase()}`).value;
            const pre  = document.getElementById(`pre-${cat.id.toLowerCase()}`).value;

            const block = document.createElement('div');
            block.className = 'category-block';

            let html = `
                <span class="category-title">${cat.label}</span>
                <div class="category-meta">
                    <span>Serving: ${time}</span>
                    <span>Pre-order by: ${pre}</span>
                </div>
            `;

            filtered.forEach(item => {
                html += `
                    <div class="menu-item">
                        <div class="menu-item-row">
                            <span class="item-name">${item.name || 'Item'}</span>
                            <span class="leader-cell"><span class="leader-dots"></span></span>
                            <span class="item-price">₹${item.price || '0'}</span>
                        </div>
                        ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
                    </div>
                `;
            });

            block.innerHTML = html;
            list.appendChild(block);
        });

        // Socials
        const footer   = document.getElementById('preview-footer');
        const socList  = document.getElementById('preview-socials-list');
        const valid    = socials.filter(s => s.handle.trim());
        if (valid.length) {
            footer.style.display = '';
            socList.innerHTML = valid.map(s => `
                <div class="social-handle">
                    ${SVGS[s.platform] || ''}
                    <span>${s.handle}</span>
                </div>
            `).join('');
        } else {
            footer.style.display = 'none';
        }
    }

    /* ── PNG Export ── */
    function downloadPNG() {
        const area    = document.getElementById('menu-capture-area');
        const btn     = document.getElementById('download-btn');
        const spinner = document.getElementById('export-spinner');
        const icon    = document.getElementById('export-icon');
        const label   = document.getElementById('export-label');

        btn.disabled = true;
        spinner.style.display = 'block';
        icon.style.display    = 'none';
        label.textContent     = 'Rendering…';

        // Small delay so the UI can update before the heavy canvas work
        setTimeout(() => {
            html2canvas(area, {
                scale: 3,
                backgroundColor: null,
                logging: false,
                useCORS: true,
                allowTaint: true,
                imageTimeout: 0,
                onclone: (doc) => {
                    const el = doc.getElementById('menu-capture-area');
                    el.style.margin      = '0';
                    el.style.boxShadow   = 'none';
                    el.style.borderRadius= '0';
                }
            }).then(canvas => {
                const link = document.createElement('a');
                const rName = document.getElementById('input-restaurant').value || 'Menu';
                link.download = `${rName.replace(/\s+/g,'-')}_Menu.png`;
                link.href     = canvas.toDataURL('image/png', 1.0);
                link.click();
            }).catch(err => {
                console.error('Export failed:', err);
                alert('Export failed. Please try again.');
            }).finally(() => {
                btn.disabled          = false;
                spinner.style.display = 'none';
                icon.style.display    = 'block';
                label.textContent     = 'Export as PNG';
            });
        }, 80);
    }

    /* ── Init ── */
    window.onload = () => { renderItemsForm(); renderSocialsForm(); updatePreview(); };
</script>
</body>
</html>
