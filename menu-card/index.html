<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Designer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ink:       #1a1208;
            --gold:      #b8892a;
            --gold-lt:   #e8c97a;
            --ui-bg:     #fafaf8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #f0ece4;
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── APP SHELL ─── */
        .app-shell {
            display: flex;
            min-height: 100vh;
        }

        /* ─── LEFT PANEL (EDITOR) ─── */
        .left-panel {
            width: 420px;
            min-width: 420px;
            background: var(--ink);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            z-index: 10;
        }
        .left-panel::-webkit-scrollbar { width: 4px; }
        .left-panel::-webkit-scrollbar-thumb { background: #3a2e20; border-radius: 2px; }

        .panel-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid #2e261a;
        }
        .panel-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px; height: 32px;
            background: var(--gold);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .logo-icon svg { width: 18px; height: 18px; fill: var(--ink); }
        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f5ede0;
            letter-spacing: 0.05em;
        }
        .panel-subtitle { font-size: 0.7rem; color: #7a6a52; font-family: Arial, sans-serif; }

        .panel-body { padding: 16px 20px 80px; display: flex; flex-direction: column; gap: 16px; }

        /* Step Cards */
        .step-card {
            background: #22190e;
            border: 1px solid #2e261a;
            border-radius: 10px;
        }
        .step-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px;
            cursor: pointer;
        }
        .step-card.open .step-header { border-bottom: 1px solid #2e261a; }
        .step-num {
            width: 22px; height: 22px;
            background: var(--gold);
            color: var(--ink);
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            font-family: Arial, sans-serif;
        }
        .step-label {
            color: #e8d8bc;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            flex-grow: 1;
        }
        .step-chevron { width: 16px; height: 16px; stroke: #7a6a52; transition: transform 0.25s; }
        .step-card.open .step-chevron { transform: rotate(180deg); }
        .step-body { max-height: 0; overflow: hidden; transition: max-height 0.35s ease-out; }
        .step-card.open .step-body { max-height: 2000px; }
        .step-inner { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

        /* Form Fields */
        .field-label {
            display: block;
            font-size: 0.65rem;
            color: #9a8a72;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-family: Arial, sans-serif;
            font-weight: 600;
        }
        .field-input {
            width: 100%;
            background: #1a1208;
            border: 1px solid #3a2e20;
            color: #f0e0c0;
            font-family: Georgia, serif;
            font-size: 16px; /* Set to 16px to prevent iOS auto-zoom on focus */
            padding: 10px 12px;
            border-radius: 8px;
            outline: none;
        }
        .field-input:focus { border-color: var(--gold); }
        textarea.field-input { min-height: 60px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .timing-group {
            background: #1a1208;
            border: 1px solid #2e261a;
            border-radius: 8px;
            padding: 12px;
        }
        .timing-group-title {
            font-size: 0.65rem;
            color: var(--gold);
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .item-card {
            background: #1a1208;
            border: 1px solid #2e261a;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .item-card-top { display: flex; justify-content: space-between; align-items: center; }
        .remove-btn { color: #5a4e3a; padding: 4px 8px; font-size: 1.1rem; }
        .item-row { display: flex; gap: 8px; }
        .item-name-input { flex: 3; }
        .item-price-input { flex: 1; }

        .social-row { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
        .social-row select { flex: 0 0 110px; font-size: 14px; }

        .add-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; padding: 12px; border: 1.5px dashed #3a2e20;
            color: var(--gold); border-radius: 8px; font-size: 0.8rem;
            font-weight: bold; text-transform: uppercase;
        }

        .theme-switcher { display: flex; gap: 8px; }
        .theme-btn {
            flex: 1; padding: 10px 4px; border-radius: 8px; border: 1.5px solid #3a2e20;
            background: #1a1208; color: #9a8a72; font-size: 0.65rem;
            text-transform: uppercase; display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .theme-btn .swatch { width: 24px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.1); }
        .theme-btn.active { border-color: var(--gold); background: #2a1e08; color: var(--gold-lt); }

        /* ─── RIGHT PANEL (PREVIEW) ─── */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
            background: #e8e2d8;
        }

        .preview-header {
            width: 100%;
            max-width: 760px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .preview-badge { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; font-weight: bold; color: #7a6a52; text-transform: uppercase; }
        .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }

        .export-btn {
            display: flex; align-items: center; gap: 8px;
            background: linear-gradient(135deg, var(--gold) 0%, #9a6e1a 100%);
            color: #1a1208; padding: 10px 16px; border-radius: 8px;
            font-size: 0.75rem; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 4px 12px rgba(184,137,42,0.3);
        }

        /* Scalable Preview Container */
        .preview-canvas-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            overflow: visible;
        }
        
        /* This container allows us to scale the fixed-width menu for mobile screens */
        .preview-scaler {
            transform-origin: top center;
            transition: transform 0.2s;
        }

        .menu-preview-wrapper {
            width: 760px; /* Kept fixed for high-quality export logic */
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            background: #fff;
        }

        /* ── THEME CORE STYLES ── */
        .menu-paper { padding: 0; width: 100%; }
        .menu-inner-border { padding: 40px 60px; min-height: 900px; display: flex; flex-direction: column; }
        
        /* Flexbox fix for dotted lines overlapping in PNG */
        .menu-item-row { display: flex; align-items: baseline; width: 100%; margin-bottom: 2px; }
        .item-name { flex-shrink: 0; padding-right: 8px; font-weight: bold; font-size: 1.1rem; }
        .leader-cell { flex-grow: 1; border-bottom: 2px dotted #ccc; margin: 0 4px; position: relative; top: -4px; }
        .item-price { flex-shrink: 0; padding-left: 8px; font-weight: bold; font-size: 1.1rem; }
        
        /* Theme specific leader colors */
        .theme-classic .leader-cell { border-color: #c8a050; }
        .theme-modern  .leader-cell { border-color: #bbbbbb; }
        .theme-bistro  .leader-cell { border-color: #5a4030; }

        /* Shared Menu UI */
        .menu-header-block { text-align: center; margin-bottom: 24px; }
        .menu-title { font-size: 2.4rem; display: block; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
        .category-block { margin-bottom: 30px; }
        .category-title { font-size: 1.3rem; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #ddd; margin-bottom: 10px; display: block; }
        .category-meta { font-size: 0.85rem; font-style: italic; color: #666; display: flex; gap: 20px; margin-bottom: 15px; }

        /* ── RESPONSIVE OVERRIDES ── */
        @media (max-width: 900px) {
            .app-shell { flex-direction: column; }
            .left-panel { width: 100%; min-width: 100%; height: auto; position: relative; }
            .panel-header { padding: 20px; }
            .right-panel { padding: 20px 10px; order: -1; background: #d0c9bc; }
            .preview-header { margin-bottom: 15px; }
            
            /* Sticky export button for mobile */
            .preview-header {
                position: sticky; top: 10px; z-index: 20; 
                background: rgba(208, 201, 188, 0.9);
                padding: 8px; border-radius: 12px; backdrop-filter: blur(8px);
            }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; display: none; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="left-panel">
        <div class="panel-header">
            <div class="panel-logo">
                <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10M4 18h6"/><rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="#1a1208" stroke-width="1.5"/></svg></div>
                <div>
                    <div class="panel-title">MENU DESIGNER</div>
                    <div class="panel-subtitle">PREVIEW & EXPORT</div>
                </div>
            </div>
        </div>

        <div class="panel-body">
            <!-- Step 1: Identity -->
            <div class="step-card open" id="step-1">
                <div class="step-header" onclick="toggleStep('step-1')">
                    <div class="step-num">1</div>
                    <div class="step-label">Identity & Theme</div>
                    <svg class="step-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <label class="field-label">Restaurant Name</label>
                        <input type="text" id="input-restaurant" placeholder="e.g. THE ROLLING CHAMMACH" class="field-input" oninput="updatePreview()">
                        <label class="field-label">Tagline</label>
                        <input type="text" id="input-tagline" placeholder="Freshly Prepared" class="field-input" oninput="updatePreview()">
                        <label class="field-label">Date</label>
                        <input type="date" id="input-date" class="field-input" oninput="updatePreview()">
                        <label class="field-label">Visual Theme</label>
                        <div class="theme-switcher">
                            <button class="theme-btn active" onclick="setTheme('classic', this)"><span class="swatch" style="background:#fdf8f0; border-color:#b8892a;"></span>Classic</button>
                            <button class="theme-btn" onclick="setTheme('modern', this)"><span class="swatch" style="background:#fff; border-color:#111;"></span>Modern</button>
                            <button class="theme-btn" onclick="setTheme('bistro', this)"><span class="swatch" style="background:#1e1510; border-color:#e8c97a;"></span>Bistro</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Timings -->
            <div class="step-card" id="step-2">
                <div class="step-header" onclick="toggleStep('step-2')">
                    <div class="step-num">2</div>
                    <div class="step-label">Meal Timings</div>
                    <svg class="step-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div class="timing-group">
                            <div class="timing-group-title">Breakfast</div>
                            <div class="grid-2">
                                <input type="text" id="time-breakfast" value="8 AM – 10 AM" class="field-input" oninput="updatePreview()">
                                <input type="text" id="pre-breakfast" value="11 PM (prev.)" class="field-input" oninput="updatePreview()">
                            </div>
                        </div>
                        <div class="timing-group">
                            <div class="timing-group-title">Lunch</div>
                            <div class="grid-2">
                                <input type="text" id="time-lunch" value="1 PM – 3:30 PM" class="field-input" oninput="updatePreview()">
                                <input type="text" id="pre-lunch" value="11 PM (prev.)" class="field-input" oninput="updatePreview()">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: Menu Items -->
            <div class="step-card open" id="step-3">
                <div class="step-header" onclick="toggleStep('step-3')">
                    <div class="step-num">3</div>
                    <div class="step-label">Menu Items</div>
                    <svg class="step-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div id="items-container" style="display:flex;flex-direction:column;gap:12px;"></div>
                        <button class="add-btn" onclick="addItem()">+ Add Item</button>
                    </div>
                </div>
            </div>

            <!-- Step 4: Social -->
            <div class="step-card" id="step-4">
                <div class="step-header" onclick="toggleStep('step-4')">
                    <div class="step-num">4</div>
                    <div class="step-label">Socials</div>
                    <svg class="step-chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="step-body">
                    <div class="step-inner">
                        <div id="socials-container"></div>
                        <button class="add-btn" onclick="addSocial()">+ Add Social Link</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="preview-header">
            <div class="preview-badge"><div class="live-dot"></div>Live Preview</div>
            <button class="export-btn" id="download-btn" onclick="downloadPNG()">
                <div class="spinner" id="export-spinner"></div>
                <span id="export-label">Download PNG</span>
            </button>
        </div>

        <div class="preview-canvas-wrap">
            <div class="preview-scaler" id="preview-scaler">
                <div id="menu-capture-area" class="menu-preview-wrapper theme-classic">
                    <div class="menu-paper">
                        <div class="menu-inner-border">
                            <div class="menu-header-block">
                                <span id="preview-restaurant" class="menu-title">THE ROLLING CHAMMACH</span>
                                <span id="preview-tagline" class="menu-tagline" style="font-style:italic; font-size:1.1rem; color:#666;"></span>
                                <span id="preview-date" class="menu-date" style="display:block; margin-top:5px; color:#888;"></span>
                            </div>
                            <div id="preview-items-list" style="flex-grow:1;"></div>
                            <div id="preview-footer" style="border-top:1px solid #ddd; padding-top:20px; text-align:center; display:none;">
                                <div id="preview-socials-list" style="display:flex; justify-content:center; gap:20px; font-weight:bold;"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Logic remains identical to your original but organized for the mobile UI
    const SVGS = {
        Instagram: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.266.069 1.645.069 4.849s-.011 3.584-.069 4.849c-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07s-3.584-.012-4.849-.07c-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.848s.012-3.584.07-4.849c.149-3.225 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072s3.667-.014 4.947-.072c4.358-.2 6.78-2.618 6.98-6.98.058-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c.796 0 1.441.645 1.441 1.44s-.645 1.44-1.441 1.44c-.795 0-1.439-.645-1.439-1.44s.644-1.44 1.439-1.44z"/></svg>`,
        WhatsApp: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`
    };

    let items = [
        { id: '1', category: 'Breakfast', name: 'Poha', price: '60', desc: 'Light, fluffed rice flakes' },
        { id: '2', category: 'Lunch', name: 'Quinoa Pulao', price: '139', desc: 'Hearty vegetables and fragrant spices' }
    ];
    let socials = [{ id: 's1', platform: 'Instagram', handle: '@yourhandle' }];
    let currentTheme = 'classic';

    function setTheme(theme, btn) {
        currentTheme = theme;
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('menu-capture-area').className = `menu-preview-wrapper theme-${theme}`;
    }

    function toggleStep(id) { document.getElementById(id).classList.toggle('open'); }

    function updatePreview() {
        document.getElementById('preview-restaurant').textContent = document.getElementById('input-restaurant').value || 'YOUR RESTAURANT';
        const tagline = document.getElementById('input-tagline').value;
        document.getElementById('preview-tagline').textContent = tagline;
        document.getElementById('preview-tagline').style.display = tagline ? 'block' : 'none';
        
        const dval = document.getElementById('input-date').value;
        const del = document.getElementById('preview-date');
        if(dval) {
            del.textContent = new Date(dval).toLocaleDateString('en-IN', { month:'long', day:'numeric', year:'numeric' });
            del.style.display = 'block';
        } else del.style.display = 'none';

        const list = document.getElementById('preview-items-list');
        list.innerHTML = '';
        ['Breakfast', 'Lunch'].forEach(cat => {
            const filtered = items.filter(i => i.category === cat);
            if(filtered.length) {
                const time = document.getElementById(`time-${cat.toLowerCase()}`).value;
                const pre = document.getElementById(`pre-${cat.toLowerCase()}`).value;
                let html = `<div class="category-block"><span class="category-title">${cat}</span>
                            <div class="category-meta"><span>Serving: ${time}</span><span>Order by: ${pre}</span></div>`;
                filtered.forEach(item => {
                    html += `<div style="margin-bottom:12px;">
                                <div class="menu-item-row">
                                    <span class="item-name">${item.name || 'Item'}</span>
                                    <div class="leader-cell"></div>
                                    <span class="item-price">₹${item.price || '0'}</span>
                                </div>
                                <div style="font-size:0.85rem; font-style:italic; color:#777; max-width:80%;">${item.desc}</div>
                             </div>`;
                });
                list.innerHTML += html + `</div>`;
            }
        });

        const sList = document.getElementById('preview-socials-list');
        const validS = socials.filter(s => s.handle);
        document.getElementById('preview-footer').style.display = validS.length ? 'block' : 'none';
        sList.innerHTML = validS.map(s => `<div style="display:flex; align-items:center; gap:6px;">${SVGS[s.platform] || ''} <span>${s.handle}</span></div>`).join('');
        
        scalePreview();
    }

    // Scale the 760px menu to fit the mobile screen width
    function scalePreview() {
        const scaler = document.getElementById('preview-scaler');
        const containerWidth = scaler.parentElement.offsetWidth;
        const menuWidth = 760;
        const scale = Math.min(1, containerWidth / menuWidth);
        scaler.style.transform = `scale(${scale})`;
        scaler.style.height = `${960 * scale}px`; // Maintain visual height in layout
    }

    function renderItemsForm() {
        const container = document.getElementById('items-container');
        container.innerHTML = '';
        items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <div class="item-card-top">
                    <select onchange="itemUpdate('${item.id}','category',this.value)" class="field-input" style="width:auto; height:32px; padding:2px 8px; font-size:12px;">
                        <option ${item.category==='Breakfast'?'selected':''}>Breakfast</option>
                        <option ${item.category==='Lunch'?'selected':''}>Lunch</option>
                    </select>
                    <button class="remove-btn" onclick="removeItem('${item.id}')">✕</button>
                </div>
                <div class="item-row">
                    <input type="text" class="field-input item-name-input" value="${item.name}" placeholder="Name" oninput="itemUpdate('${item.id}','name',this.value)">
                    <input type="text" class="field-input item-price-input" value="${item.price}" placeholder="₹" oninput="itemUpdate('${item.id}','price',this.value)">
                </div>
                <input type="text" class="field-input" value="${item.desc}" placeholder="Description" oninput="itemUpdate('${item.id}','desc',this.value)">
            `;
            container.appendChild(div);
        });
        updatePreview();
    }

    function itemUpdate(id, key, val) { const i = items.find(x => x.id === id); i[key] = val; updatePreview(); }
    function addItem() { items.push({ id: Date.now().toString(), category: 'Breakfast', name: '', price: '', desc: '' }); renderItemsForm(); }
    function removeItem(id) { items = items.filter(i => i.id !== id); renderItemsForm(); }

    function addSocial() { socials.push({ id: Date.now().toString(), platform: 'Instagram', handle: '' }); renderSocials(); }
    function renderSocials() {
        const container = document.getElementById('socials-container');
        container.innerHTML = socials.map(s => `
            <div class="social-row">
                <select class="field-input" onchange="socUpdate('${s.id}','platform',this.value)">
                    <option ${s.platform==='Instagram'?'selected':''}>Instagram</option>
                    <option ${s.platform==='WhatsApp'?'selected':''}>WhatsApp</option>
                </select>
                <input type="text" class="field-input" value="${s.handle}" placeholder="@handle" oninput="socUpdate('${s.id}','handle',this.value)">
                <button class="remove-btn" onclick="removeSoc('${s.id}')">✕</button>
            </div>
        `).join('');
        updatePreview();
    }
    function socUpdate(id, key, val) { const s = socials.find(x => x.id === id); s[key] = val; updatePreview(); }
    function removeSoc(id) { socials = socials.filter(s => s.id !== id); renderSocials(); }

    function downloadPNG() {
        const btn = document.getElementById('download-btn');
        const spinner = document.getElementById('export-spinner');
        const label = document.getElementById('export-label');
        btn.disabled = true; spinner.style.display = 'inline-block'; label.textContent = 'Generating...';

        // Temporarily reset scaling for high-res capture
        const scaler = document.getElementById('preview-scaler');
        const originalTransform = scaler.style.transform;
        scaler.style.transform = 'none';

        setTimeout(() => {
            html2canvas(document.getElementById('menu-capture-area'), { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'menu.png';
                link.href = canvas.toDataURL();
                link.click();
                scaler.style.transform = originalTransform;
                btn.disabled = false; spinner.style.display = 'none'; label.textContent = 'Download PNG';
            });
        }, 100);
    }

    window.addEventListener('resize', scalePreview);
    window.onload = () => { renderItemsForm(); renderSocials(); };
</script>
</body>
</html>
