<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saman App - Grocery List Generator</title>
  <meta name="description" content="Visual grocery item swiper and fast WhatsApp grocery list generator." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for in-browser execution -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-outfit {
      font-family: 'Outfit', sans-serif;
    }
    .dot-pattern {
      background-image: radial-gradient(#10b981 1px, transparent 1px);
      background-size: 8px 8px;
    }
  </style>
</head>
<body class="bg-[#fafaf9] text-neutral-900 min-h-screen antialiased">
  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Sound Synthesizer via Web Audio API
    class SoundFx {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playAdd() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.14);
        } catch(e) {}
      }
      playSkip() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(329.63, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(220.00, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }
    }
    const sound = new SoundFx();

    // Default Grocery Items
    const DEFAULT_ITEMS = [
      { id: '1', name: 'Whole Milk', category: 'Dairy', imageUrl: 'https://images.unsplash.com/photo-1563636619-e9143da7973b?auto=format&fit=crop&w=600&q=80' },
      { id: '2', name: 'Farm Fresh Eggs', category: 'Dairy & Eggs', imageUrl: 'https://images.unsplash.com/photo-1582722872445-44dc5f7e3c8f?auto=format&fit=crop&w=600&q=80' },
      { id: '3', name: 'Artisan Bread', category: 'Bakery', imageUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' },
      { id: '4', name: 'Fresh Bananas', category: 'Fruits', imageUrl: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?auto=format&fit=crop&w=600&q=80' },
      { id: '5', name: 'Red Crisp Apples', category: 'Fruits', imageUrl: 'https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?auto=format&fit=crop&w=600&q=80' },
      { id: '6', name: 'Ripe Tomatoes', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=600&q=80' },
      { id: '7', name: 'Yellow Onions', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1508747703725-719777637510?auto=format&fit=crop&w=600&q=80' },
      { id: '8', name: 'Baby Potatoes', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1518977676601-b53f82aba655?auto=format&fit=crop&w=600&q=80' },
      { id: '9', name: 'Basmati Rice', category: 'Grains & Staples', imageUrl: 'https://images.unsplash.com/photo-1586201375761-83865001e31c?auto=format&fit=crop&w=600&q=80' },
      { id: '10', name: 'Wheat Flour (Atta)', category: 'Grains & Staples', imageUrl: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=600&q=80' },
      { id: '11', name: 'Pure Butter', category: 'Dairy', imageUrl: 'https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?auto=format&fit=crop&w=600&q=80' },
      { id: '12', name: 'Greek Yogurt', category: 'Dairy', imageUrl: 'https://images.unsplash.com/photo-1488477181946-6428a0291777?auto=format&fit=crop&w=600&q=80' },
      { id: '13', name: 'Cheddar Cheese', category: 'Dairy', imageUrl: 'https://images.unsplash.com/photo-1618164435735-413d3b066c9a?auto=format&fit=crop&w=600&q=80' },
      { id: '14', name: 'Extra Virgin Olive Oil', category: 'Oils', imageUrl: 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?auto=format&fit=crop&w=600&q=80' },
      { id: '15', name: 'Fresh Garlic Bulbs', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1540148426945-6cf22a6b2383?auto=format&fit=crop&w=600&q=80' },
      { id: '16', name: 'Fresh Ginger Root', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&w=600&q=80' },
      { id: '17', name: 'Green Spinach', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1576045057995-568f588f82fb?auto=format&fit=crop&w=600&q=80' },
      { id: '18', name: 'Fresh Broccoli', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1459411621453-7b03977f4bfc?auto=format&fit=crop&w=600&q=80' },
      { id: '19', name: 'Orange Carrots', category: 'Vegetables', imageUrl: 'https://images.unsplash.com/photo-1598170845058-32b9d6a5c317?auto=format&fit=crop&w=600&q=80' },
      { id: '20', name: 'Italian Pasta', category: 'Pantry', imageUrl: 'https://images.unsplash.com/photo-1551462147-ff29053bfc14?auto=format&fit=crop&w=600&q=80' },
      { id: '21', name: 'Rolled Oats', category: 'Breakfast', imageUrl: 'https://images.unsplash.com/photo-1586444248902-2f64eddc13df?auto=format&fit=crop&w=600&q=80' },
      { id: '22', name: 'Ground Coffee Roast', category: 'Beverages', imageUrl: 'https://images.unsplash.com/photo-1559056199-641a0ac8b55e?auto=format&fit=crop&w=600&q=80' },
      { id: '23', name: 'Green Tea Bags', category: 'Beverages', imageUrl: 'https://images.unsplash.com/photo-1627435601361-ec25f5b1d0e5?auto=format&fit=crop&w=600&q=80' },
      { id: '24', name: 'Dishwashing Soap', category: 'Household', imageUrl: 'https://images.unsplash.com/photo-1585670270608-b404fb001d7d?auto=format&fit=crop&w=600&q=80' },
      { id: '25', name: 'Paper Towel Rolls', category: 'Household', imageUrl: 'https://images.unsplash.com/photo-1584556812952-905ffd0c611a?auto=format&fit=crop&w=600&q=80' }
    ];

    const PRESET_IMAGES = [
      { name: 'Fresh Fruits', url: 'https://images.unsplash.com/photo-1619566636858-adf3ef46400b?auto=format&fit=crop&w=600&q=80' },
      { name: 'Avocado', url: 'https://images.unsplash.com/photo-1523049673857-eb18f1d7b578?auto=format&fit=crop&w=600&q=80' },
      { name: 'Strawberries', url: 'https://images.unsplash.com/photo-1464965911861-746a04b4bca6?auto=format&fit=crop&w=600&q=80' },
      { name: 'Almond Milk', url: 'https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=600&q=80' }
    ];

    function App() {
      const [page, setPage] = useState('home'); // 'home' | 'list' | 'add'
      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem('saman_items');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch(e) {}
        return DEFAULT_ITEMS;
      });

      const [selectedItems, setSelectedItems] = useState(() => {
        try {
          const saved = localStorage.getItem('saman_list');
          if (saved) return JSON.parse(saved);
        } catch(e) {}
        return [];
      });

      const [currentIndex, setCurrentIndex] = useState(0);
      const [history, setHistory] = useState([]);
      const [dragOffset, setDragOffset] = useState(0);
      const [isDragging, setIsDragging] = useState(false);
      const dragStartX = useRef(0);

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('saman_items', JSON.stringify(items));
      }, [items]);

      useEffect(() => {
        localStorage.setItem('saman_list', JSON.stringify(selectedItems));
      }, [selectedItems]);

      const currentItem = items[currentIndex];
      const isFinished = currentIndex >= items.length;

      // Add item
      const handleAdd = () => {
        if (!currentItem || isFinished) return;
        sound.playAdd();
        setSelectedItems(prev => {
          const exists = prev.find(i => i.id === currentItem.id);
          if (exists) {
            return prev.map(i => i.id === currentItem.id ? { ...i, qty: i.qty + 1 } : i);
          }
          return [...prev, { id: currentItem.id, name: currentItem.name, qty: 1, checked: false }];
        });
        setHistory(prev => [...prev, { index: currentIndex, action: 'add' }]);
        setCurrentIndex(prev => prev + 1);
        setDragOffset(0);
      };

      // Skip item
      const handleSkip = () => {
        if (!currentItem || isFinished) return;
        sound.playSkip();
        setHistory(prev => [...prev, { index: currentIndex, action: 'skip' }]);
        setCurrentIndex(prev => prev + 1);
        setDragOffset(0);
      };

      // Undo
      const handleUndo = () => {
        if (history.length === 0) return;
        const last = history[history.length - 1];
        setHistory(prev => prev.slice(0, -1));
        setCurrentIndex(last.index);
      };

      // Drag Touch Handlers
      const handleTouchStart = (e) => {
        dragStartX.current = e.touches[0].clientX;
        setIsDragging(true);
      };
      const handleTouchMove = (e) => {
        if (!isDragging) return;
        const currentX = e.touches[0].clientX;
        setDragOffset(currentX - dragStartX.current);
      };
      const handleTouchEnd = () => {
        setIsDragging(false);
        if (dragOffset > 70) {
          handleAdd();
        } else if (dragOffset < -70) {
          handleSkip();
        }
        setDragOffset(0);
      };

      // Keyboard Controls
      useEffect(() => {
        const onKey = (e) => {
          if (page !== 'home' || isFinished) return;
          if (e.key === 'ArrowRight' || e.key === 'Enter') handleAdd();
          if (e.key === 'ArrowLeft' || e.key === 'Backspace') handleSkip();
          if (e.key === 'g' || e.key === 'G') setPage('list');
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      });

      return (
        <div className="min-h-screen flex flex-col max-w-xl mx-auto px-4 py-4 justify-between">
          {/* Header */}
          <header className="flex items-center justify-between border-b border-neutral-200 pb-3">
            <div className="w-16">
              {page === 'home' && selectedItems.length > 0 && (
                <button 
                  onClick={() => setPage('list')}
                  className="px-2.5 py-1 bg-emerald-100 text-emerald-800 text-xs font-bold rounded-full border border-emerald-300"
                >
                  {selectedItems.length} Added
                </button>
              )}
            </div>

            <div className="text-center">
              <h1 
                onClick={() => setPage('home')}
                className="text-2xl sm:text-3xl font-black font-outfit uppercase tracking-wider cursor-pointer"
              >
                SAMAN APP
              </h1>
              <p className="text-[10px] text-neutral-400 font-semibold tracking-tight">
                Grocery Swiper & WhatsApp Generator
              </p>
            </div>

            <div className="w-16 flex justify-end">
              {page !== 'add' && (
                <button
                  onClick={() => setPage('add')}
                  className="px-3 py-1.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 border-2 border-emerald-600 rounded-xl font-bold text-xs shadow-sm transition-all active:scale-95"
                >
                  Add Item
                </button>
              )}
            </div>
          </header>

          {/* PAGE 1: HOME SWIPER */}
          {page === 'home' && (
            <div className="flex-1 flex flex-col items-center justify-center my-4">
              {/* Progress info */}
              <div className="w-full flex items-center justify-between mb-3 text-xs font-bold text-neutral-500">
                <span className="bg-neutral-100 px-2.5 py-1 rounded-full border border-neutral-200">
                  {isFinished ? items.length : currentIndex + 1} / {items.length}
                </span>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={() => currentIndex > 0 && setCurrentIndex(c => c - 1)}
                    disabled={currentIndex === 0}
                    className="p-1 border border-neutral-300 rounded bg-white disabled:opacity-40"
                  >
                    ◀
                  </button>
                  <button
                    onClick={() => currentIndex < items.length - 1 && setCurrentIndex(c => c + 1)}
                    disabled={currentIndex >= items.length - 1}
                    className="p-1 border border-neutral-300 rounded bg-white disabled:opacity-40"
                  >
                    ▶
                  </button>
                  {history.length > 0 && (
                    <button
                      onClick={handleUndo}
                      className="px-2 py-1 text-xs font-bold text-amber-700 bg-amber-50 border border-amber-300 rounded"
                    >
                      Undo
                    </button>
                  )}
                </div>
              </div>

              {/* Product Card Container */}
              {!isFinished && currentItem ? (
                <div 
                  onTouchStart={handleTouchStart}
                  onTouchMove={handleTouchMove}
                  onTouchEnd={handleTouchEnd}
                  style={{
                    transform: `translateX(${dragOffset}px) rotate(${dragOffset * 0.05}deg)`,
                    transition: isDragging ? 'none' : 'transform 0.2s ease-out'
                  }}
                  className="w-full max-w-[340px] sm:max-w-[360px] aspect-[4/4.8] bg-white border-2 border-neutral-800 rounded-3xl p-4 sm:p-5 flex flex-col justify-between shadow-[0_8px_20px_rgba(0,0,0,0.08)] cursor-grab"
                >
                  {/* Category */}
                  <div className="text-[10px] font-bold text-neutral-400 uppercase tracking-wider">
                    {currentItem.category || 'Grocery'}
                  </div>

                  {/* Inner Image Frame */}
                  <div className="w-full flex-1 bg-neutral-100 border-2 border-neutral-800 rounded-2xl overflow-hidden my-2 flex items-center justify-center p-1.5">
                    <img 
                      src={currentItem.imageUrl} 
                      alt={currentItem.name} 
                      className="w-full h-full object-cover rounded-xl pointer-events-none"
                      onError={(e) => {
                        e.target.src = 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';
                      }}
                    />
                  </div>

                  {/* Name below image */}
                  <div className="text-center mt-2">
                    <h2 className="text-xl sm:text-2xl font-black font-outfit uppercase tracking-tight text-neutral-900">
                      {currentItem.name}
                    </h2>
                    <p className="text-[11px] text-neutral-400 font-medium">
                      Swipe right to add • Swipe left to skip
                    </p>
                  </div>
                </div>
              ) : (
                <div className="w-full max-w-[340px] bg-white border-2 border-neutral-800 rounded-3xl p-6 text-center shadow-lg">
                  <div className="text-4xl mb-2">🎉</div>
                  <h2 className="text-2xl font-black font-outfit uppercase">All Done!</h2>
                  <p className="text-sm text-neutral-600 my-3">
                    You added <strong className="text-emerald-700">{selectedItems.length} items</strong> to your grocery list.
                  </p>
                  <button
                    onClick={() => setPage('list')}
                    className="w-full py-3 bg-emerald-500 text-white font-extrabold rounded-2xl border-2 border-neutral-900 shadow-[0_4px_0_#171717] active:translate-y-1 active:shadow-none"
                  >
                    VIEW LIST ({selectedItems.length})
                  </button>
                </div>
              )}

              {/* Action Buttons: Green Check & Red Cross */}
              {!isFinished && (
                <div className="flex items-center justify-center gap-10 my-6">
                  {/* Green Check */}
                  <button
                    onClick={handleAdd}
                    className="w-16 h-16 rounded-2xl bg-emerald-500 hover:bg-emerald-600 active:scale-90 border-2 border-neutral-900 flex items-center justify-center text-white shadow-[0_5px_0_#171717] active:translate-y-1 active:shadow-none transition-all cursor-pointer text-2xl font-black"
                  >
                    <div className="w-9 h-9 rounded-full border-2 border-white flex items-center justify-center bg-white/20">
                      ✓
                    </div>
                  </button>

                  {/* Red Cross */}
                  <button
                    onClick={handleSkip}
                    className="w-16 h-16 rounded-2xl bg-rose-500 hover:bg-rose-600 active:scale-90 border-2 border-neutral-900 flex items-center justify-center text-white shadow-[0_5px_0_#171717] active:translate-y-1 active:shadow-none transition-all cursor-pointer text-2xl font-black"
                  >
                    <div className="w-9 h-9 rounded-full border-2 border-white flex items-center justify-center bg-white/20">
                      ✕
                    </div>
                  </button>
                </div>
              )}

              {/* Bottom GENERATE LIST Button */}
              <div className="w-full max-w-[340px] sm:max-w-[360px]">
                <button
                  onClick={() => setPage('list')}
                  className="w-full py-3.5 px-4 rounded-2xl font-black font-outfit text-base uppercase tracking-wider border-2 border-neutral-900 bg-emerald-200 hover:bg-emerald-300 text-emerald-950 shadow-[0_4px_0_#171717] active:translate-y-1 active:shadow-none dot-pattern transition-all cursor-pointer"
                >
                  GENERATE LIST {selectedItems.length > 0 ? `(${selectedItems.length})` : ''}
                </button>
              </div>
            </div>
          )}

          {/* PAGE 2: GENERATED GROCERY LIST */}
          {page === 'list' && (
            <div className="flex-1 flex flex-col justify-between my-2">
              <div>
                {/* Back Button */}
                <div className="flex items-center justify-between mb-4">
                  <button
                    onClick={() => setPage('home')}
                    className="w-11 h-11 rounded-full border-2 border-neutral-800 flex items-center justify-center bg-white hover:bg-neutral-100 active:scale-95 shadow-[0_2px_0_#171717] font-bold text-lg"
                  >
                    ←
                  </button>
                  {selectedItems.length > 0 && (
                    <button
                      onClick={() => {
                        if (confirm('Clear entire grocery list?')) setSelectedItems([]);
                      }}
                      className="text-xs font-bold text-rose-600 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-200"
                    >
                      Clear List
                    </button>
                  )}
                </div>

                {/* Main List Box */}
                <div className="bg-white border-2 border-neutral-800 rounded-3xl p-5 sm:p-6 shadow-[0_6px_16px_rgba(0,0,0,0.06)]">
                  <div className="flex items-center justify-between border-b-2 border-neutral-800 pb-2 mb-4">
                    <h2 className="text-2xl font-black font-outfit uppercase tracking-wide">
                      LIST:
                    </h2>
                    <span className="text-xs font-bold bg-neutral-100 px-2.5 py-0.5 rounded-full border border-neutral-300">
                      {selectedItems.length} items
                    </span>
                  </div>

                  {selectedItems.length === 0 ? (
                    <div className="py-10 text-center text-neutral-400">
                      <p className="font-bold text-neutral-600">Your grocery list is empty</p>
                      <p className="text-xs mt-1">Go back to swipe and add items.</p>
                      <button
                        onClick={() => setPage('home')}
                        className="mt-3 px-3.5 py-1.5 bg-neutral-900 text-white rounded-xl text-xs font-bold"
                      >
                        Start Swiping
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-2 max-h-[50vh] overflow-y-auto pr-1">
                      {selectedItems.map((item, idx) => (
                        <div
                          key={item.id}
                          className={`flex items-center justify-between p-2.5 rounded-xl border-2 transition-all ${
                            item.checked ? 'bg-neutral-50 border-neutral-200 text-neutral-400' : 'bg-white border-neutral-200 hover:border-neutral-800'
                          }`}
                        >
                          <div 
                            onClick={() => {
                              setSelectedItems(prev => prev.map(i => i.id === item.id ? { ...i, checked: !i.checked } : i));
                            }}
                            className="flex items-center gap-2.5 flex-1 cursor-pointer"
                          >
                            <span className="w-6 h-6 rounded-lg bg-neutral-100 font-black font-outfit text-xs flex items-center justify-center border border-neutral-300">
                              {idx + 1}.
                            </span>
                            <span className={`font-bold font-outfit text-base uppercase ${item.checked ? 'line-through text-neutral-400' : 'text-neutral-900'}`}>
                              {item.name}
                            </span>
                          </div>

                          <div className="flex items-center gap-1.5">
                            <div className="flex items-center bg-neutral-100 border border-neutral-300 rounded-lg text-xs">
                              <button 
                                onClick={() => setSelectedItems(prev => prev.map(i => i.id === item.id ? { ...i, qty: Math.max(1, i.qty - 1) } : i))}
                                className="px-1.5 py-0.5 hover:bg-neutral-200"
                              >
                                -
                              </button>
                              <span className="px-1.5 font-bold">{item.qty}</span>
                              <button 
                                onClick={() => setSelectedItems(prev => prev.map(i => i.id === item.id ? { ...i, qty: i.qty + 1 } : i))}
                                className="px-1.5 py-0.5 hover:bg-neutral-200"
                              >
                                +
                              </button>
                            </div>
                            <button
                              onClick={() => setSelectedItems(prev => prev.filter(i => i.id !== item.id))}
                              className="text-neutral-300 hover:text-rose-600 px-1 text-sm font-bold"
                            >
                              ✕
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

              {/* Bottom SEND TO WHATSAPP Button */}
              <div className="pt-4 pb-2">
                <button
                  onClick={() => {
                    let msg = `🛒 *Saman Grocery List*\n\n`;
                    selectedItems.forEach((item, idx) => {
                      msg += `${idx + 1}. ${item.name}${item.qty > 1 ? ` (x${item.qty})` : ''}\n`;
                    });
                    msg += `\n_Created via Saman App_`;
                    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
                  }}
                  disabled={selectedItems.length === 0}
                  className="w-full py-4 px-4 rounded-2xl font-black font-outfit text-lg uppercase tracking-wider border-2 border-neutral-900 bg-emerald-200 hover:bg-emerald-300 disabled:opacity-40 text-emerald-950 shadow-[0_4px_0_#171717] active:translate-y-1 active:shadow-none dot-pattern transition-all cursor-pointer flex items-center justify-center gap-2"
                >
                  <span>📲 SEND TO WHATSAPP</span>
                </button>
              </div>
            </div>
          )}

          {/* PAGE 3: ADD NEW ITEMS */}
          {page === 'add' && (
            <div className="flex-1 flex flex-col justify-between my-2">
              <div>
                {/* Back Button */}
                <div className="flex items-center justify-between mb-4">
                  <button
                    onClick={() => setPage('home')}
                    className="w-11 h-11 rounded-full border-2 border-neutral-800 flex items-center justify-center bg-white hover:bg-neutral-100 active:scale-95 shadow-[0_2px_0_#171717] font-bold text-lg"
                  >
                    ←
                  </button>
                  <span className="text-xs font-bold uppercase tracking-wider text-neutral-400 font-outfit">
                    Add Grocery Item
                  </span>
                </div>

                {/* Form Frame matching wireframe 3 */}
                <div className="bg-white border-2 border-neutral-800 rounded-3xl p-5 sm:p-6 shadow-[0_6px_16px_rgba(0,0,0,0.06)]">
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    const name = form.itemName.value.trim();
                    const imageUrl = form.itemUrl.value.trim() || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80';
                    if (!name) return;

                    const newItem = {
                      id: 'custom-' + Date.now(),
                      name,
                      imageUrl,
                      category: 'Custom'
                    };
                    setItems(prev => [newItem, ...prev]);
                    form.reset();
                    alert(`"${name}" was added to your swiper catalog!`);
                    setPage('home');
                    setCurrentIndex(0);
                  }}>
                    {/* Name: */}
                    <div className="mb-4">
                      <label className="block text-base font-black font-outfit uppercase tracking-wide mb-1">
                        Name:
                      </label>
                      <input
                        name="itemName"
                        required
                        placeholder="e.g. Fresh Mangoes, Oat Milk..."
                        className="w-full px-3.5 py-2.5 bg-neutral-50 border-2 border-neutral-800 rounded-xl font-semibold text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-400"
                      />
                    </div>

                    {/* Image url: */}
                    <div className="mb-4">
                      <label className="block text-base font-black font-outfit uppercase tracking-wide mb-1">
                        Image url:
                      </label>
                      <input
                        name="itemUrl"
                        type="url"
                        placeholder="https://images.unsplash.com/... (or pick below)"
                        className="w-full px-3.5 py-2.5 bg-neutral-50 border-2 border-neutral-800 rounded-xl font-medium text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-emerald-400"
                      />
                    </div>

                    {/* Quick photo presets */}
                    <div className="mb-4">
                      <span className="block text-xs font-bold text-neutral-500 uppercase mb-1.5">
                        Quick Photo Presets
                      </span>
                      <div className="grid grid-cols-4 gap-2">
                        {PRESET_IMAGES.map(preset => (
                          <div 
                            key={preset.name}
                            onClick={(e) => {
                              const form = e.currentTarget.closest('form');
                              form.itemUrl.value = preset.url;
                              if (!form.itemName.value) form.itemName.value = preset.name;
                            }}
                            className="border-2 border-neutral-200 hover:border-emerald-600 rounded-xl overflow-hidden cursor-pointer aspect-square relative"
                          >
                            <img src={preset.url} alt={preset.name} className="w-full h-full object-cover" />
                            <span className="absolute inset-x-0 bottom-0 bg-black/50 text-[9px] text-white font-bold px-1 py-0.5 truncate block text-center">
                              {preset.name}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-3.5 px-4 rounded-2xl font-black font-outfit text-base uppercase tracking-wider border-2 border-neutral-900 bg-emerald-200 hover:bg-emerald-300 text-emerald-950 shadow-[0_4px_0_#171717] active:translate-y-1 active:shadow-none dot-pattern transition-all cursor-pointer mt-2"
                    >
                      + ADD ITEM TO CATALOG
                    </button>
                  </form>
                </div>
              </div>

              <p className="text-center text-xs text-neutral-400 py-3">
                Items added here appear immediately in your swiper.
              </p>
            </div>
          )}

          {/* Footer */}
          <footer className="text-center text-[10px] text-neutral-400 font-semibold py-1">
            Saman App © {new Date().getFullYear()}
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
