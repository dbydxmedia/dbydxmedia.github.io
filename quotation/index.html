<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interior Designer Quotation Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom scrollbar for better UI */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* Ensure the print area maintains a desktop-like width for clean image export even on mobile */
        #print-area-container {
            overflow-x: auto;
        }
        #print-area {
            min-width: 800px; /* Fixed width to guarantee no text wrapping/overlapping in image */
            background-color: white;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-24">

    <!-- Navbar -->
    <nav class="bg-indigo-600 text-white shadow-md p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex items-center gap-2">
            <i data-lucide="calculator" class="w-6 h-6"></i>
            <h1 class="text-xl font-bold tracking-wide">InteriorQuote Pro</h1>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mt-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Column: Inputs -->
        <div class="lg:col-span-7 space-y-6">
            
            <!-- Client Details Section -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="user" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="text-lg font-semibold">Client Details</h2>
                </div>
                <div>
                    <label class="text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider block">Client Name</label>
                    <input type="text" placeholder="Enter client name..."
                           onchange="updateClientName(this.value)"
                           class="w-full border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
            </section>

            <!-- Rates Section -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <div class="flex items-center gap-2 mb-4">
                    <i data-lucide="indian-rupee" class="w-5 h-5 text-indigo-600"></i>
                    <h2 class="text-lg font-semibold">Cost Rates (per Sq.Ft)</h2>
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="rates-container">
                    <!-- Rates rendered via JS -->
                </div>
            </section>

            <!-- Rooms Section -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold flex items-center gap-2">
                        <i data-lucide="layout-dashboard" class="w-5 h-5 text-indigo-600"></i>
                        Project Details
                    </h2>
                    <button onclick="addRoom()" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> Add Room
                    </button>
                </div>
                
                <div id="rooms-container" class="space-y-4">
                    <!-- Rooms rendered via JS -->
                </div>
            </section>

        </div>

        <!-- Right Column: Report Generation & Preview -->
        <div class="lg:col-span-5 relative">
            <div class="sticky top-24 space-y-4">
                <button onclick="generateReport()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-lg">
                    <i data-lucide="file-check-2"></i> Generate Quotation Report
                </button>

                <!-- Hidden Report Container (Shown in Modal instead for better UX) -->
            </div>
        </div>

    </main>

    <!-- Full Screen Modal for Report Preview -->
    <div id="report-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-4 border-b bg-slate-50">
                <h2 class="text-xl font-bold text-slate-800">Quotation Preview</h2>
                <div class="flex gap-2">
                    <button onclick="downloadImage()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 shadow-sm">
                        <i data-lucide="download" class="w-4 h-4"></i> Download as JPEG
                    </button>
                    <button onclick="closeReport()" class="p-2 text-slate-500 hover:bg-slate-200 rounded-lg transition-colors">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- Modal Body (Printable Area) -->
            <div class="overflow-y-auto p-6 bg-slate-100 flex-1" id="print-area-container">
                <div id="print-area" class="bg-white p-10 shadow-sm border border-slate-200 mx-auto text-slate-800">
                    <!-- Report content rendered via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        const ROOM_TYPES = ['Hall', 'Master Bedroom', 'Children Bedroom', 'Guest Bedroom', 'Kitchen', 'Dining Room', 'Office Room', 'Front Room', 'Other'];
        const ITEM_TYPES = ['Box', 'Frame', 'Panel', 'Other'];

        let state = {
            clientName: '',
            rates: {
                Box: 1200,
                Frame: 800,
                Panel: 1000,
                Other: 500
            },
            rooms: []
        };

        // --- Core Logic ---
        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function addRoom() {
            state.rooms.push({
                id: generateId(),
                type: 'Hall',
                customName: '',
                items: []
            });
            renderRooms();
        }

        function removeRoom(roomId) {
            state.rooms = state.rooms.filter(r => r.id !== roomId);
            renderRooms();
        }

        function updateRoom(roomId, field, value) {
            const room = state.rooms.find(r => r.id === roomId);
            if (room) {
                room[field] = value;
                if (field === 'type' && value !== 'Other') {
                    room.customName = '';
                }
                renderRooms();
            }
        }

        function addItem(roomId) {
            const room = state.rooms.find(r => r.id === roomId);
            if (room) {
                room.items.push({
                    id: generateId(),
                    type: 'Box',
                    customName: '',
                    lF: 0, lI: 0,
                    bF: 0, bI: 0
                });
                renderRooms();
            }
        }

        function removeItem(roomId, itemId) {
            const room = state.rooms.find(r => r.id === roomId);
            if (room) {
                room.items = room.items.filter(i => i.id !== itemId);
                renderRooms();
            }
        }

        function updateItem(roomId, itemId, field, value) {
            const room = state.rooms.find(r => r.id === roomId);
            if (room) {
                const item = room.items.find(i => i.id === itemId);
                if (item) {
                    item[field] = field === 'type' || field === 'customName' ? value : (parseFloat(value) || 0);
                    if (field === 'type' && value !== 'Other') {
                        item.customName = '';
                    }
                    renderRooms(); // Re-render to update calculations
                }
            }
        }

        function updateRate(type, value) {
            state.rates[type] = parseFloat(value) || 0;
        }

        function updateClientName(value) {
            state.clientName = value;
        }

        // --- Math Helpers ---
        function calculateSqFt(lF, lI, bF, bI) {
            const lengthInFeet = (parseFloat(lF) || 0) + ((parseFloat(lI) || 0) / 12);
            const breadthInFeet = (parseFloat(bF) || 0) + ((parseFloat(bI) || 0) / 12);
            return (lengthInFeet * breadthInFeet).toFixed(2);
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount);
        }

        function getRoomDisplayName(room) {
            return room.type === 'Other' && room.customName ? room.customName : room.type;
        }

        function getItemDisplayName(item) {
            return item.type === 'Other' && item.customName ? item.customName : item.type;
        }

        // --- Rendering ---
        function renderRates() {
            const container = document.getElementById('rates-container');
            container.innerHTML = ITEM_TYPES.map(type => `
                <div class="flex flex-col">
                    <label class="text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">${type} (₹)</label>
                    <input type="number" 
                           value="${state.rates[type]}" 
                           onchange="updateRate('${type}', this.value)"
                           class="border border-slate-300 rounded-md p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
            `).join('');
        }

        function renderRooms() {
            const container = document.getElementById('rooms-container');
            
            if (state.rooms.length === 0) {
                container.innerHTML = `
                    <div class="text-center p-8 bg-white border border-dashed border-slate-300 rounded-xl text-slate-500">
                        <i data-lucide="home" class="w-10 h-10 mx-auto mb-2 text-slate-400"></i>
                        <p>No rooms added yet. Click "Add Room" to begin.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = state.rooms.map((room, roomIndex) => `
                <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden mb-4 transition-all">
                    <!-- Room Header -->
                    <div class="bg-slate-50 border-b border-slate-200 p-4 flex flex-wrap gap-3 items-center justify-between">
                        <div class="flex items-center gap-3 flex-1 min-w-[250px]">
                            <span class="bg-indigo-100 text-indigo-700 font-bold w-8 h-8 rounded-full flex items-center justify-center text-sm">${roomIndex + 1}</span>
                            <div class="flex-1 flex gap-2">
                                <select onchange="updateRoom('${room.id}', 'type', this.value)" class="border border-slate-300 rounded-md p-2 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none w-48">
                                    ${ROOM_TYPES.map(t => `<option value="${t}" ${room.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                                </select>
                                ${room.type === 'Other' ? `
                                    <input type="text" placeholder="Custom Room Name" value="${room.customName}" onchange="updateRoom('${room.id}', 'customName', this.value)" class="border border-slate-300 rounded-md p-2 text-sm flex-1 focus:ring-2 focus:ring-indigo-500 outline-none">
                                ` : ''}
                            </div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="addItem('${room.id}')" class="bg-white border border-indigo-200 text-indigo-600 hover:bg-indigo-50 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors">
                                + Add Item
                            </button>
                            <button onclick="removeRoom('${room.id}')" class="text-red-500 hover:bg-red-50 p-1.5 rounded-lg transition-colors" title="Remove Room">
                                <i data-lucide="trash-2" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Room Items -->
                    <div class="p-4 bg-white">
                        ${room.items.length === 0 ? `<p class="text-sm text-slate-400 italic text-center py-2">No items in this room. Add woodwork, frames, panels, etc.</p>` : `
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse min-w-[600px]">
                                    <thead>
                                        <tr class="text-xs text-slate-500 uppercase tracking-wider border-b border-slate-200">
                                            <th class="pb-2 font-semibold w-1/4">Item Type</th>
                                            <th class="pb-2 font-semibold text-center" colspan="2">Length</th>
                                            <th class="pb-2 font-semibold text-center" colspan="2">Breadth</th>
                                            <th class="pb-2 font-semibold text-right">Sq.Ft</th>
                                            <th class="pb-2"></th>
                                        </tr>
                                        <tr class="text-[10px] text-slate-400 border-b border-slate-100">
                                            <th></th>
                                            <th class="pb-1 text-center font-normal">Feet</th>
                                            <th class="pb-1 text-center font-normal">Inches</th>
                                            <th class="pb-1 text-center font-normal">Feet</th>
                                            <th class="pb-1 text-center font-normal">Inches</th>
                                            <th></th>
                                            <th></th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100">
                                        ${room.items.map(item => {
                                            const sqft = calculateSqFt(item.lF, item.lI, item.bF, item.bI);
                                            return `
                                            <tr class="hover:bg-slate-50 transition-colors">
                                                <td class="py-2 pr-2">
                                                    <div class="flex flex-col gap-1">
                                                        <select onchange="updateItem('${room.id}', '${item.id}', 'type', this.value)" class="border border-slate-300 rounded p-1.5 text-sm w-full outline-none focus:border-indigo-500">
                                                            ${ITEM_TYPES.map(t => `<option value="${t}" ${item.type === t ? 'selected' : ''}>${t}</option>`).join('')}
                                                        </select>
                                                        ${item.type === 'Other' ? `
                                                            <input type="text" placeholder="Specify item..." value="${item.customName}" onchange="updateItem('${room.id}', '${item.id}', 'customName', this.value)" class="border border-slate-300 rounded p-1.5 text-sm w-full outline-none focus:border-indigo-500">
                                                        ` : ''}
                                                    </div>
                                                </td>
                                                <td class="py-2 px-1"><input type="number" min="0" value="${item.lF || ''}" onchange="updateItem('${room.id}', '${item.id}', 'lF', this.value)" class="w-16 border border-slate-300 rounded p-1.5 text-sm text-center outline-none"></td>
                                                <td class="py-2 px-1"><input type="number" min="0" max="11" value="${item.lI || ''}" onchange="updateItem('${room.id}', '${item.id}', 'lI', this.value)" class="w-16 border border-slate-300 rounded p-1.5 text-sm text-center outline-none"></td>
                                                <td class="py-2 px-1"><input type="number" min="0" value="${item.bF || ''}" onchange="updateItem('${room.id}', '${item.id}', 'bF', this.value)" class="w-16 border border-slate-300 rounded p-1.5 text-sm text-center outline-none"></td>
                                                <td class="py-2 px-1"><input type="number" min="0" max="11" value="${item.bI || ''}" onchange="updateItem('${room.id}', '${item.id}', 'bI', this.value)" class="w-16 border border-slate-300 rounded p-1.5 text-sm text-center outline-none"></td>
                                                <td class="py-2 pl-2 text-right font-semibold text-slate-700">
                                                    ${sqft > 0 ? sqft : '-'}
                                                </td>
                                                <td class="py-2 text-right pl-2">
                                                    <button onclick="removeItem('${room.id}', '${item.id}')" class="text-slate-400 hover:text-red-500 p-1 transition-colors">
                                                        <i data-lucide="x-circle" class="w-5 h-5"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        `}).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        // --- Report Generation ---
        function generateReport() {
            if (state.rooms.length === 0) {
                alert("Please add at least one room before generating a quotation.");
                return;
            }

            const printArea = document.getElementById('print-area');
            const dateStr = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            
            // Calculate aggregations
            let grandTotalSqFt = 0;
            let grandTotalCost = 0;
            const summaryByType = {};
            ITEM_TYPES.forEach(t => summaryByType[t] = { sqft: 0, cost: 0 });

            let html = `
                <!-- Header -->
                <div class="flex justify-between items-start mb-8 border-b-2 border-slate-800 pb-6">
                    <div>
                        <h1 class="text-4xl font-extrabold text-slate-900 tracking-tight uppercase">Quotation</h1>
                        <p class="text-slate-500 mt-1">Interior Design & Execution</p>
                        ${state.clientName ? `<div class="mt-4"><p class="text-sm text-slate-500 uppercase tracking-wide font-semibold">Prepared For:</p><p class="text-xl font-bold text-indigo-900">${state.clientName}</p></div>` : ''}
                    </div>
                    <div class="text-right">
                        <p class="font-semibold text-slate-800">Date: <span class="font-normal text-slate-600">${dateStr}</span></p>
                        <p class="font-semibold text-slate-800 mt-1">Ref: <span class="font-normal text-slate-600">INT-${Math.floor(Math.random()*10000)}</span></p>
                    </div>
                </div>

                <!-- Base Rates Applied -->
                <div class="mb-8 bg-slate-50 p-4 rounded-lg border border-slate-200">
                    <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Applied Rates (per Sq.Ft)</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        ${ITEM_TYPES.map(t => `
                            <div>
                                <span class="text-xs text-slate-500 uppercase block">${t}</span>
                                <span class="font-semibold text-slate-800">₹${state.rates[t]}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- Room Breakdown -->
                <div class="mb-10">
                    <h2 class="text-xl font-bold text-slate-800 mb-4 uppercase tracking-wide border-l-4 border-indigo-600 pl-3">Room-wise Breakdown</h2>
            `;

            state.rooms.forEach((room, index) => {
                const roomName = getRoomDisplayName(room);
                let roomTotalCost = 0;
                let roomTotalSqFt = 0;

                if (room.items.length > 0) {
                    html += `
                        <div class="mb-6">
                            <h3 class="font-bold text-lg text-indigo-900 bg-indigo-50 p-2 rounded-t-lg">${index + 1}. ${roomName}</h3>
                            <table class="w-full text-left border-collapse border border-slate-200">
                                <thead>
                                    <tr class="bg-slate-100 text-sm text-slate-600">
                                        <th class="border border-slate-200 p-2 w-1/3">Item Description</th>
                                        <th class="border border-slate-200 p-2 text-center w-1/4">Dimensions (L x B)</th>
                                        <th class="border border-slate-200 p-2 text-right">Area (Sq.Ft)</th>
                                        <th class="border border-slate-200 p-2 text-right">Rate (₹)</th>
                                        <th class="border border-slate-200 p-2 text-right">Amount (₹)</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    room.items.forEach(item => {
                        const itemName = getItemDisplayName(item);
                        const sqft = parseFloat(calculateSqFt(item.lF, item.lI, item.bF, item.bI));
                        const rate = state.rates[item.type] || 0;
                        const cost = sqft * rate;

                        roomTotalSqFt += sqft;
                        roomTotalCost += cost;

                        // Add to summary
                        if (!summaryByType[item.type]) summaryByType[item.type] = { sqft: 0, cost: 0 };
                        summaryByType[item.type].sqft += sqft;
                        summaryByType[item.type].cost += cost;

                        html += `
                                    <tr class="text-sm">
                                        <td class="border border-slate-200 p-2 font-medium text-slate-700">${itemName}</td>
                                        <td class="border border-slate-200 p-2 text-center text-slate-500">${item.lF}'${item.lI}" x ${item.bF}'${item.bI}"</td>
                                        <td class="border border-slate-200 p-2 text-right">${sqft.toFixed(2)}</td>
                                        <td class="border border-slate-200 p-2 text-right">${rate}</td>
                                        <td class="border border-slate-200 p-2 text-right font-semibold">${formatCurrency(cost)}</td>
                                    </tr>
                        `;
                    });

                    grandTotalSqFt += roomTotalSqFt;
                    grandTotalCost += roomTotalCost;

                    html += `
                                    <tr class="bg-slate-50 font-bold text-sm">
                                        <td colspan="2" class="border border-slate-200 p-2 text-right">Room Total:</td>
                                        <td class="border border-slate-200 p-2 text-right text-indigo-700">${roomTotalSqFt.toFixed(2)}</td>
                                        <td class="border border-slate-200 p-2"></td>
                                        <td class="border border-slate-200 p-2 text-right text-indigo-700">${formatCurrency(roomTotalCost)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    `;
                }
            });

            html += `</div>`;

            // Summary Section
            html += `
                <div class="mb-10">
                    <h2 class="text-xl font-bold text-slate-800 mb-4 uppercase tracking-wide border-l-4 border-emerald-600 pl-3">Summary by Category</h2>
                    <table class="w-full text-left border-collapse border border-slate-200 shadow-sm">
                        <thead>
                            <tr class="bg-slate-800 text-white text-sm">
                                <th class="border border-slate-300 p-3">Category</th>
                                <th class="border border-slate-300 p-3 text-right">Total Area (Sq.Ft)</th>
                                <th class="border border-slate-300 p-3 text-right">Rate (₹)</th>
                                <th class="border border-slate-300 p-3 text-right">Total Amount (₹)</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            for (const type in summaryByType) {
                if (summaryByType[type].sqft > 0) {
                    html += `
                        <tr class="text-sm">
                            <td class="border border-slate-200 p-3 font-semibold text-slate-700">${type}</td>
                            <td class="border border-slate-200 p-3 text-right">${summaryByType[type].sqft.toFixed(2)}</td>
                            <td class="border border-slate-200 p-3 text-right">${state.rates[type]}</td>
                            <td class="border border-slate-200 p-3 text-right font-semibold">${formatCurrency(summaryByType[type].cost)}</td>
                        </tr>
                    `;
                }
            }

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            // Grand Total
            html += `
                <div class="flex justify-end mt-8 border-t-2 border-slate-800 pt-6">
                    <div class="w-1/2 bg-slate-50 p-6 rounded-xl border border-slate-200 shadow-sm">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-slate-500 font-semibold">Total Square Feet:</span>
                            <span class="text-lg font-bold text-slate-800">${grandTotalSqFt.toFixed(2)} Sq.Ft</span>
                        </div>
                        <div class="flex justify-between items-center border-t border-slate-200 pt-3 mt-3">
                            <span class="text-xl font-bold text-slate-800 uppercase">Grand Total:</span>
                            <span class="text-3xl font-extrabold text-indigo-700">${formatCurrency(grandTotalCost)}</span>
                        </div>
                        <p class="text-xs text-slate-400 text-right mt-2">*Prices are exclusive of applicable taxes.</p>
                    </div>
                </div>
                
                <!-- Footer branding -->
                <div class="mt-12 text-center border-t border-slate-200 pt-4 text-slate-400 text-sm">
                    Generated via InteriorQuote Pro
                </div>
            `;

            printArea.innerHTML = html;
            
            // Show modal
            document.getElementById('report-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden'; // prevent background scrolling
        }

        function closeReport() {
            document.getElementById('report-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // --- Export to JPEG ---
        function downloadImage() {
            const printArea = document.getElementById('print-area');
            const originalBorder = printArea.style.border;
            const originalShadow = printArea.style.boxShadow;
            
            // Temporarily remove outer styles for clean capture
            printArea.style.border = 'none';
            printArea.style.boxShadow = 'none';

            // Use html2canvas
            html2canvas(printArea, {
                scale: 2, // High resolution
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                // Restore styles
                printArea.style.border = originalBorder;
                printArea.style.boxShadow = originalShadow;

                // Create download link
                const link = document.createElement('a');
                link.download = `Quotation_${new Date().getTime()}.jpeg`;
                link.href = canvas.toDataURL('image/jpeg', 0.95);
                link.click();
            }).catch(err => {
                console.error("Error generating image: ", err);
                alert("An error occurred while generating the image. Please try again.");
                
                // Restore styles on error
                printArea.style.border = originalBorder;
                printArea.style.boxShadow = originalShadow;
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderRates();
            // Start with one room by default
            addRoom();
        });

    </script>
</body>
</html>
